spring:
  servlet:
    multipart:
      # Margen sobre el máximo de 2 MB de la foto de perfil, que valida el dominio con su propio mensaje.
      max-file-size: 3MB
      max-request-size: 4MB
  application:
    name: portfolio-backend

  # PERSISTENCIA POSTGRESQL (NEON.TECH)
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/portfolio_db}
    username: ${DB_USERNAME:postgres}
    password: ${DB_PASSWORD:postgres}
    driver-class-name: org.postgresql.Driver
    hikari:
      maximum-pool-size: 10
      minimum-idle: 2
      idle-timeout: 30000
      max-lifetime: 1800000
      # Sin esto, con la base de datos caída cada petición (incluido /telemetry/health) espera 30s
      connection-timeout: 5000

  # MIGRACIONES FLYWAY
  flyway:
    enabled: true
    locations: classpath:db/migration
    baseline-on-migrate: true

  # JPA / HIBERNATE
  jpa:
    hibernate:
      ddl-auto: validate
    show-sql: false
    properties:
      hibernate:
        format_sql: true
        dialect: org.hibernate.dialect.PostgreSQLDialect

  # CACHÉ REDIS (UPSTASH)
  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}
      password: ${REDIS_PASSWORD:}
      timeout: 2s
      connect-timeout: 2s
      ssl:
        enabled: ${REDIS_SSL_ENABLED:false}

# DOCUMENTACIÓN: Swagger UI sobre el contrato OpenAPI (contract-first). springdoc necesita
# api-docs activo para registrar la UI, pero /v3/api-docs (lo generado desde el código) no es
# público: SecurityConfig solo abre /v3/api-docs/swagger-config. La única fuente es portfolio-api-spec.
springdoc:
  swagger-ui:
    path: /swagger-ui.html
    url: /openapi.yaml
    try-it-out-enabled: true

server:
  port: 8080
  servlet:
    context-path: /v1

# LOGGING STANDARDS
logging:
  level:
    root: INFO
    dev.portfolio: DEBUG
    org.flywaydb: INFO

# SEGURIDAD
security:
  # Clave HMAC en Base64, mínimo 256 bits: `openssl rand -base64 32`
  jwt:
    secret: ${JWT_SECRET}
    expiration: ${JWT_EXPIRATION:1h}
  # Credenciales del cliente admin para POST /auth/token (grantType client_credentials)
  admin-client:
    id: ${ADMIN_CLIENT_ID:admin-ui}
    secret: ${ADMIN_CLIENT_SECRET}
  # Sesiones de las personas (POST /auth/login). El token de acceso dura poco porque no se puede
  # revocar; el de refresco es de un solo uso y sí se revoca. Si no hay ninguna cuenta y se dan
  # ADMIN_BOOTSTRAP_EMAIL y ADMIN_BOOTSTRAP_PASSWORD (12 a 72 caracteres), al arrancar se crea
  # con ellos el primer administrador; después esas variables ya no hacen nada.
  sessions:
    access-ttl: ${SESSION_ACCESS_TTL:15m}
    refresh-ttl: ${SESSION_REFRESH_TTL:7d}
    bootstrap-email: ${ADMIN_BOOTSTRAP_EMAIL:}
    bootstrap-password: ${ADMIN_BOOTSTRAP_PASSWORD:}
  # Orígenes del frontend, separados por comas
  cors:
    allowed-origins: ${CORS_ALLOWED_ORIGINS:http://localhost:4200}
  # Intentos permitidos en POST /auth/token por dirección de origen y ventana
  rate-limit:
    auth-token:
      max-requests: ${AUTH_RATE_LIMIT_MAX_REQUESTS:5}
      window: ${AUTH_RATE_LIMIT_WINDOW:1m}
    # Preguntas a POST /ai/rag/query por dirección de origen
    rag-query:
      max-requests: ${RAG_RATE_LIMIT_MAX_REQUESTS:10}
      window: ${RAG_RATE_LIMIT_WINDOW:1m}
    # Tope total de preguntas entre todos los orígenes: protege la cuota del proveedor de IA
    rag-query-global:
      max-requests: ${RAG_GLOBAL_LIMIT_MAX_REQUESTS:500}
      window: ${RAG_GLOBAL_LIMIT_WINDOW:24h}
    # Generaciones de Terraform (POST /public/architecture/generate-terraform) por dirección de origen
    terraform:
      max-requests: ${TERRAFORM_RATE_LIMIT_MAX_REQUESTS:30}
      window: ${TERRAFORM_RATE_LIMIT_WINDOW:1m}
    # Cotizaciones (POST /public/architecture/pricing) por dirección de origen
    pricing:
      max-requests: ${PRICING_RATE_LIMIT_MAX_REQUESTS:30}
      window: ${PRICING_RATE_LIMIT_WINDOW:1m}
    # Llamadas a herramientas del servidor MCP (/mcp) por dirección de origen. Sin autenticación:
    # los clientes que se conectan desde la nube de su proveedor comparten dirección y cupo.
    mcp:
      max-requests: ${MCP_RATE_LIMIT_MAX_REQUESTS:30}
      window: ${MCP_RATE_LIMIT_WINDOW:1m}
    # Tope diario de llamadas a herramientas MCP entre todos los orígenes
    mcp-global:
      max-requests: ${MCP_GLOBAL_LIMIT_MAX_REQUESTS:2000}
      window: ${MCP_GLOBAL_LIMIT_WINDOW:24h}

# MOTOR DE PRECIOS (FinOps). Lee precios de lista de las fuentes públicas de los proveedores; Azure
# y AWS no necesitan claves. Cada tarifa se guarda 24 h; la última conocida se conserva 30 días para
# servirla si el proveedor no responde. Con PRICING_AZURE_ENABLED=false y
# PRICING_AWS_ENABLED=false no se hace ninguna llamada saliente y todo se cotiza como «precio desconocido».
pricing:
  cache-ttl: ${PRICING_CACHE_TTL:24h}
  last-known-ttl: ${PRICING_LAST_KNOWN_TTL:30d}
  azure:
    enabled: ${PRICING_AZURE_ENABLED:true}
    base-url: ${PRICING_AZURE_BASE_URL:https://prices.azure.com/api/retail/prices}
    region: ${PRICING_AZURE_REGION:eastus}
    connect-timeout: 3s
    read-timeout: 6s
    # Se abre con el 50% de fallos en las últimas 10 llamadas y reintenta al minuto
    circuit-breaker:
      failure-rate-threshold: 50
      sliding-window-size: 10
      minimum-calls: 4
      open-duration: 60s
      half-open-calls: 2

  # Oracle Cloud: lista pública de precios, sin clave. Solo se consulta para la nube `oci`,
  # que está detrás de la flag cloud.oracle.
  oci:
    enabled: ${PRICING_OCI_ENABLED:true}
    base-url: ${PRICING_OCI_BASE_URL:https://apexapps.oracle.com/pls/apex/cetools/api/v1/products/}
    connect-timeout: 3s
    read-timeout: 6s
    circuit-breaker:
      failure-rate-threshold: 50
      sliding-window-size: 10
      minimum-calls: 4
      open-duration: 60s
      half-open-calls: 2

  # AWS: ficheros públicos de precios por servicio y región, sin clave. Se leen en streaming; uno
  # mayor que max-bytes no se lee (el de EC2 pesa unos 460 MB: por eso no hay tarifa de máquinas).
  aws:
    enabled: ${PRICING_AWS_ENABLED:true}
    base-url: ${PRICING_AWS_BASE_URL:https://pricing.us-east-1.amazonaws.com}
    connect-timeout: 3s
    read-timeout: 20s
    max-bytes: ${PRICING_AWS_MAX_BYTES:48MB}
  # Google Cloud: su Pricing API exige clave (GCP_PRICING_API_KEY). Sin clave, o sin SKU asignados
  # en pricing.gcp.skus.<código> (sku-id, label, note), no se hace ninguna llamada.
  gcp:
    api-key: ${GCP_PRICING_API_KEY:}
    base-url: ${PRICING_GCP_BASE_URL:https://cloudbilling.googleapis.com}
    region: ${PRICING_GCP_REGION:us-east1}

# MOTOR DE IA (GEMINI). Sin GEMINI_API_KEY la aplicación arranca y las llamadas de IA responden 503.
# Cambiar el modelo de embeddings obliga a reindexar: los vectores de modelos distintos no son comparables.
ai:
  gemini:
    api-key: ${GEMINI_API_KEY:}
    embedding-model: ${GEMINI_EMBEDDING_MODEL:gemini-embedding-2}
    chat-model: ${GEMINI_CHAT_MODEL:gemini-3.5-flash-lite}
    connect-timeout: 5s
    read-timeout: 30s
    # Se abre con el 50% de fallos del proveedor en las últimas 10 llamadas y reintenta a los 30s
    circuit-breaker:
      failure-rate-threshold: 50
      sliding-window-size: 10
      minimum-calls: 5
      open-duration: 30s
      half-open-calls: 2
  # Carpeta con el código fuente a indexar (en local: RAG_CODE_ROOT=.. desde portfolio-backend).
  # Vacío = solo se indexa el contenido del CMS.
  rag:
    code-root: ${RAG_CODE_ROOT:}

# TRAYECTORIA: documento Markdown del que sale GET /public/career-timeline
# (en local, relativo a portfolio-backend; en la imagen Docker se copia a /app/docs).
career:
  story-path: ${CAREER_STORY_PATH:../docs/career/CAREER_STORY.md}
  # Línea de contacto de la cabecera del CV descargable (correo, ciudad, enlace). Vacía = no se imprime.
  cv-contact: ${CV_CONTACT:}
  # Foto de perfil del CV (JPEG o PNG). Se sube desde administración o se deja el archivo ahí.
  # En un contenedor debe apuntar a un volumen para que lo subido no se pierda.
  photo-path: ${PROFILE_PHOTO_PATH:../docs/career/profile-photo}
