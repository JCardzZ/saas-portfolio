plugins {
    id 'java'
    id 'jacoco'
    id 'org.springframework.boot' version '3.5.16'
    id 'io.spring.dependency-management' version '1.1.7'
    id 'org.openapi.generator' version '7.3.0'
}

group = 'dev.portfolio'
version = '1.0.0-SNAPSHOT'

java {
    toolchain {
        languageVersion = JavaLanguageVersion.of(21)
    }
}

repositories {
    mavenCentral()
}

// Versiones que Spring Boot gestiona, adelantadas a la que corrige vulnerabilidades altas o críticas
// publicadas después de su última versión (las detecta Trivy en CI). Al subir Spring Boot,
// quitar las que ya vengan iguales o por encima.
ext['jackson-bom.version'] = '2.21.7'
ext['netty.version'] = '4.1.139.Final'
ext['tomcat.version'] = '10.1.60'
ext['postgresql.version'] = '42.7.13'

sourceSets {
    main {
        java {
            srcDir "$buildDir/generated/src/main/java"
        }
    }
    // Tests que necesitan Docker (Testcontainers): fuera de `test` para que este no dependa de Docker.
    integrationTest {
        compileClasspath += sourceSets.main.output
        runtimeClasspath += sourceSets.main.output
    }
}

configurations {
    integrationTestImplementation.extendsFrom testImplementation
    integrationTestRuntimeOnly.extendsFrom testRuntimeOnly
}

// Batik y Xalan llegan por openhtmltopdf-svg-support en versiones con vulnerabilidades conocidas
// (CVE-2022-42890, CVE-2022-44729, CVE-2022-34169): se fuerzan las corregidas en todos sus módulos.
configurations.configureEach {
    resolutionStrategy.eachDependency { details ->
        if (details.requested.group == 'org.apache.xmlgraphics' && details.requested.name.startsWith('batik-')) {
            details.useVersion '1.17'
        }
        if (details.requested.group == 'xalan') {
            details.useVersion '2.7.3'
        }
        // Batik 1.17 trae commons-io 2.11.0 (CVE-2024-47554).
        if (details.requested.group == 'commons-io' && details.requested.name == 'commons-io') {
            details.useVersion '2.14.0'
        }
    }
}

dependencies {
    implementation 'org.springframework.boot:spring-boot-starter-web'
    implementation 'org.springframework.boot:spring-boot-starter-validation'
    implementation 'org.springframework.boot:spring-boot-starter-security'
    implementation 'org.springframework.boot:spring-boot-starter-data-jpa'
    
    // Persistence, Migrations & Cache
    implementation 'org.flywaydb:flyway-core'
    // Desde Flyway 10 el soporte de cada base de datos va en su propio módulo: sin este, no arranca.
    runtimeOnly 'org.flywaydb:flyway-database-postgresql'
    runtimeOnly 'org.postgresql:postgresql'
    implementation 'org.springframework.boot:spring-boot-starter-data-redis'

    // JWT Security
    implementation 'io.jsonwebtoken:jjwt-api:0.12.5'
    runtimeOnly 'io.jsonwebtoken:jjwt-impl:0.12.5'
    runtimeOnly 'io.jsonwebtoken:jjwt-jackson:0.12.5'

    implementation 'org.openapitools:jackson-databind-nullable:0.2.6'
    implementation 'io.swagger.core.v3:swagger-annotations:2.2.20'

    implementation 'org.mapstruct:mapstruct:1.5.5.Final'
    implementation 'io.github.resilience4j:resilience4j-circuitbreaker:2.2.0'
    // Feature flags: API estándar de OpenFeature; el proveedor es propio (PostgreSQL + caché Redis)
    implementation 'dev.openfeature:sdk:1.23.0'
    // Servidor MCP (hito 6): SDK oficial de Java, solo el núcleo y su transporte Servlet (sin Spring AI,
    // que exige Spring Boot 4). El mapeo JSON va con Jackson 2, el mismo de la aplicación.
    implementation 'io.modelcontextprotocol.sdk:mcp-core:2.0.1'
    implementation 'io.modelcontextprotocol.sdk:mcp-json-jackson2:2.0.1'
    // Generación del CV en PDF (adaptador OpenPdfCvRenderer)
    implementation 'com.github.librepdf:openpdf:1.3.43'
    // CV maquetado: plantilla HTML+CSS a PDF sin navegador (StyledCvPdfWriter); el segundo dibuja los SVG
    implementation 'com.openhtmltopdf:openhtmltopdf-pdfbox:1.0.10'
    implementation 'com.openhtmltopdf:openhtmltopdf-svg-support:1.0.10'

    compileOnly 'org.projectlombok:lombok'
    annotationProcessor 'org.projectlombok:lombok'
    annotationProcessor 'org.projectlombok:lombok-mapstruct-binding:0.2.0'
    annotationProcessor 'org.mapstruct:mapstruct-processor:1.5.5.Final'

    testImplementation 'org.springframework.boot:spring-boot-starter-test'
    // Tests de integración con PostgreSQL (pgvector) y Redis reales en contenedores
    integrationTestImplementation 'org.testcontainers:junit-jupiter'
    integrationTestImplementation 'org.testcontainers:postgresql'
    // Cliente HTTP de los tests: el del JDK no deja leer un 401 a una petición con cuerpo
    integrationTestImplementation 'org.apache.httpcomponents.client5:httpclient5'
    // Reglas de arquitectura sobre el bytecode (HexagonalArchitectureTest)
    testImplementation 'com.tngtech.archunit:archunit-junit5:1.3.0'
}

openApiGenerate {
    generatorName = "spring"
    inputSpec = "$projectDir/../portfolio-api-spec/saas-portfolio-v1.openapi.yaml"
    outputDir = "$buildDir/generated"
    apiPackage = "dev.portfolio.api"
    modelPackage = "dev.portfolio.model"
    cleanupOutput = true
    // El cuerpo SSE del contrato se sirve con el emisor de Spring MVC en lugar de un String.
    schemaMappings = [
        TelemetryStream: "org.springframework.web.servlet.mvc.method.annotation.SseEmitter"
    ]
    configOptions = [
        interfaceOnly: "true",
        useSpringBoot3: "true",
        useJakartaEe: "true",
        skipDefaultInterface: "true",
        useTags: "true"
    ]
}

compileJava.dependsOn tasks.openApiGenerate

tasks.named('test') {
    useJUnitPlatform()
    finalizedBy tasks.named('jacocoTestReport')
}

// Cobertura de `test`: build/reports/jacoco/test (HTML, XML y CSV). El código generado del
// contrato OpenAPI y el de MapStruct no cuentan: no se escriben a mano.
tasks.named('jacocoTestReport') {
    dependsOn tasks.named('test')
    reports {
        xml.required = true
        csv.required = true
        html.required = true
    }
    classDirectories.setFrom(files(classDirectories.files.collect {
        fileTree(dir: it, excludes: ['dev/portfolio/api/**', 'dev/portfolio/model/**', '**/*MapperImpl*'])
    }))
}

// La aplicación completa contra PostgreSQL (pgvector) y Redis en contenedores. Necesita Docker:
//   ./gradlew integrationTest
tasks.register('integrationTest', Test) {
    description = 'Tests de integración con Testcontainers (necesita Docker)'
    group = 'verification'
    useJUnitPlatform()
    testClassesDirs = sourceSets.integrationTest.output.classesDirs
    classpath = sourceSets.integrationTest.runtimeClasspath
    shouldRunAfter tasks.named('test')
}

// Solo las reglas de arquitectura (también forman parte de `test`):
//   ./gradlew architectureTest
tasks.register('architectureTest', Test) {
    description = 'Comprueba las reglas de la arquitectura hexagonal con ArchUnit'
    group = 'verification'
    useJUnitPlatform()
    filter { includeTestsMatching 'dev.portfolio.architecture.*' }
    testClassesDirs = sourceSets.test.output.classesDirs
    classpath = sourceSets.test.runtimeClasspath
}

// Exporta los CV en PDF a los estáticos del frontend, para el modo demo (sin backend):
//   ./gradlew exportCv
tasks.register('exportCv', Test) {
    description = 'Genera los CV en PDF en portfolio-frontend/public/cv'
    group = 'documentation'
    useJUnitPlatform()
    testClassesDirs = sourceSets.test.output.classesDirs
    classpath = sourceSets.test.runtimeClasspath
    systemProperty 'cv.export.dir', file('../portfolio-frontend/public/cv').absolutePath
    filter { includeTestsMatching '*CvExportTest' }
    outputs.upToDateWhen { false }
}
