plugins {
    id 'java'
    id 'org.springframework.boot' version '3.2.3'
    id 'io.spring.dependency-management' version '1.1.4'
    id 'org.openapi.generator' version '7.3.0'
}

group = 'dev.portfolio'
version = '1.0.0-SNAPSHOT'

java {
    toolchain {
        languageVersion = JavaLanguageVersion.of(21)
    }
}

repositories {
    mavenCentral()
}

dependencies {
    implementation 'org.springframework.boot:spring-boot-starter-web'
    implementation 'org.springframework.boot:spring-boot-starter-validation'
    implementation 'org.springframework.boot:spring-boot-starter-security'
    implementation 'org.springframework.boot:spring-boot-starter-data-jpa'
    
    // Persistence, Migrations & Cache
    implementation 'org.flywaydb:flyway-core'
    runtimeOnly 'org.postgresql:postgresql'
    implementation 'org.springframework.boot:spring-boot-starter-data-redis'

    // JWT Security
    implementation 'io.jsonwebtoken:jjwt-api:0.12.5'
    runtimeOnly 'io.jsonwebtoken:jjwt-impl:0.12.5'
    runtimeOnly 'io.jsonwebtoken:jjwt-jackson:0.12.5'

    implementation 'org.openapitools:jackson-databind-nullable:0.2.6'
    implementation 'io.swagger.core.v3:swagger-annotations:2.2.20'

    implementation 'org.mapstruct:mapstruct:1.5.5.Final'
    implementation 'io.github.resilience4j:resilience4j-circuitbreaker:2.2.0'
    // Generación del CV en PDF (adaptador OpenPdfCvRenderer)
    implementation 'com.github.librepdf:openpdf:1.3.43'
    // CV maquetado: plantilla HTML+CSS a PDF sin navegador (StyledCvPdfWriter); el segundo dibuja los SVG
    implementation 'com.openhtmltopdf:openhtmltopdf-pdfbox:1.0.10'
    implementation 'com.openhtmltopdf:openhtmltopdf-svg-support:1.0.10'

    compileOnly 'org.projectlombok:lombok'
    annotationProcessor 'org.projectlombok:lombok'
    annotationProcessor 'org.projectlombok:lombok-mapstruct-binding:0.2.0'
    annotationProcessor 'org.mapstruct:mapstruct-processor:1.5.5.Final'

    testImplementation 'org.springframework.boot:spring-boot-starter-test'
}

openApiGenerate {
    generatorName = "spring"
    inputSpec = "$projectDir/../portfolio-api-spec/saas-portfolio-v1.openapi.yaml"
    outputDir = "$buildDir/generated"
    apiPackage = "dev.portfolio.api"
    modelPackage = "dev.portfolio.model"
    cleanupOutput = true
    // El cuerpo SSE del contrato se sirve con el emisor de Spring MVC en lugar de un String.
    schemaMappings = [
        TelemetryStream: "org.springframework.web.servlet.mvc.method.annotation.SseEmitter"
    ]
    configOptions = [
        interfaceOnly: "true",
        useSpringBoot3: "true",
        useJakartaEe: "true",
        skipDefaultInterface: "true",
        useTags: "true"
    ]
}

sourceSets {
    main {
        java {
            srcDir "$buildDir/generated/src/main/java"
        }
    }
}

compileJava.dependsOn tasks.openApiGenerate

tasks.named('test') {
    useJUnitPlatform()
}

// Exporta los CV en PDF a los estáticos del frontend, para el modo demo (sin backend):
//   ./gradlew exportCv
tasks.register('exportCv', Test) {
    description = 'Genera los CV en PDF en portfolio-frontend/public/cv'
    group = 'documentation'
    useJUnitPlatform()
    testClassesDirs = sourceSets.test.output.classesDirs
    classpath = sourceSets.test.runtimeClasspath
    systemProperty 'cv.export.dir', file('../portfolio-frontend/public/cv').absolutePath
    filter { includeTestsMatching '*CvExportTest' }
    outputs.upToDateWhen { false }
}
