name: CI

on:
  pull_request:
  push:
    branches: [main]

# Un push nuevo a la misma rama o PR cancela la ejecución anterior.
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

jobs:
  # Decide qué partes cambiaron. Se filtra aquí y no con `on.paths` para que el workflow se
  # ejecute siempre: un job omitido cuenta como aprobado en una regla de protección de rama,
  # un workflow que no arranca la deja esperando.
  changes:
    name: Cambios
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: read
    outputs:
      backend: ${{ steps.filter.outputs.backend }}
      frontend: ${{ steps.filter.outputs.frontend }}
    steps:
      - uses: actions/checkout@v4
      - uses: dorny/paths-filter@v3
        id: filter
        with:
          filters: |
            backend:
              - 'portfolio-backend/**'
              - 'portfolio-api-spec/**'
              - 'docs/career/**'
              - '.github/workflows/ci.yml'
            frontend:
              - 'portfolio-frontend/**'
              - '.github/workflows/ci.yml'

  backend:
    name: Backend (tests)
    needs: changes
    if: needs.changes.outputs.backend == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: portfolio-backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - name: Caché de Gradle
        uses: gradle/actions/setup-gradle@v4
      - name: Tests
        run: ./gradlew test --no-daemon
      - name: Informe de tests
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: backend-test-report
          path: portfolio-backend/build/reports/tests/test
          retention-days: 7

  frontend:
    name: Frontend (tests y build)
    needs: changes
    if: needs.changes.outputs.frontend == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: portfolio-frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: portfolio-frontend/package-lock.json
      - name: Dependencias
        run: npm ci
      - name: Tests
        run: npx ng test --watch=false --browsers=ChromeHeadlessCI
      - name: Build de producción
        run: npm run build

  gitleaks:
    name: Secretos (gitleaks)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          # Todo el historial: un secreto borrado en un commit posterior sigue estando en el repositorio.
          fetch-depth: 0
      - uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITLEAKS_CONFIG: .gitleaks.toml
