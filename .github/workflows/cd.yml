name: CD

# Build once, deploy many: este workflow NO construye nada. Se dispara cuando la CI termina bien
# en main y despliega exactamente lo que esa ejecución construyó y verificó:
#   - el artefacto `frontend-dist`           → 🚀 Cloudflare Pages
#   - la imagen de GHCR que pasó Trivy       → 🚀 Cloud Run → 🧪 Health + smoke
#     (artefacto `backend-image`, por digest)   → ✅ Release (semver) o 🚀 Rollback
#
# Cada despliegue tiene una versión vX.Y.Z (Conventional Commits, .github/scripts/release-info.sh):
# se calcula una vez en Origen, el sitio la sirve en version.json, Cloud Run la recibe en APP_VERSION
# (GET /telemetry/health) y, si todo lo desplegado termina bien, se publica como release de GitHub.
#
# El despliegue del backend es SOLO manual (Run workflow → "Desplegar el backend en Cloud Run").
# A mano se despliega lo último que la CI publicó en main: el frontend y la imagen pueden venir de
# ejecuciones distintas, porque cada una solo se construye si cambió.
#
# Secrets:   CLOUDFLARE_API_TOKEN, CLOUDFLARE_ACCOUNT_ID            (frontend)
#            ninguno para Google Cloud: el job se autentica con Workload Identity Federation
# Variables: CLOUDFLARE_PAGES_PROJECT   sin ella el frontend no se despliega
#            API_BASE_URL               dirección pública de la API (p. ej. https://api.ejemplo.dev/v1);
#                                       la usan el frontend y las pruebas de humo
#            GCP_WIF_PROVIDER, GCP_DEPLOY_SA, GCP_PROJECT_ID, GCP_REGION,
#            GCP_ARTIFACT_REPO, CLOUD_RUN_SERVICE   backend en Cloud Run (sin ellas no se despliega)
# Environment "production": añade ahí revisores obligatorios para que el despliegue pida aprobación.

on:
  workflow_run:
    workflows: [CI]
    types: [completed]
    branches: [main]
  workflow_dispatch:
    inputs:
      deploy_backend:
        description: Desplegar el backend en Cloud Run
        type: boolean
        default: false

# Los despliegues van de uno en uno y en orden: el siguiente espera, no cancela al que está en curso.
concurrency:
  group: cd-production
  cancel-in-progress: false

permissions:
  contents: read

env:
  WRANGLER_VERSION: 4.148.0

jobs:
  # Decide qué se despliega y de qué ejecución de la CI sale.
  source:
    name: 🔍 Origen
    # Tras la CI: solo si terminó bien, fue por un push a main y es de este repositorio (una CI
    # lanzada a mano o desde un fork no despliega). A mano: siempre.
    if: >-
      ${{ github.event_name == 'workflow_dispatch'
          || (github.event.workflow_run.conclusion == 'success'
              && github.event.workflow_run.event == 'push'
              && github.event.workflow_run.head_branch == 'main'
              && github.event.workflow_run.head_repository.full_name == github.repository) }}
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      contents: read
      actions: read
      packages: read
    outputs:
      signature: ${{ steps.verify.outcome }}
      frontend-run: ${{ steps.find.outputs.frontend_run }}
      frontend-sha: ${{ steps.find.outputs.frontend_sha }}
      image-run: ${{ steps.find.outputs.image_run }}
      image-sha: ${{ steps.find.outputs.image_sha }}
      image-ref: ${{ steps.find.outputs.image_ref }}
      version: ${{ steps.release.outputs.version }}
      release-sha: ${{ steps.release.outputs.sha }}
      release-new: ${{ steps.release.outputs.new }}
    steps:
      # Historial y etiquetas completos: de ahí sale la versión del despliegue.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - name: Buscar lo que construyó la CI
        id: find
        env:
          GH_TOKEN: ${{ github.token }}
          TRIGGER_RUN: ${{ github.event.workflow_run.id }}
          # Quién hizo el merge que disparó la CI (o quién lanzó este workflow a mano).
          ACTOR: ${{ github.event.workflow_run.triggering_actor.login || github.actor }}
        run: |
          set -euo pipefail
          REPO="$GITHUB_REPOSITORY"
          if [ -n "$TRIGGER_RUN" ]; then
            # Tras la CI: solo cuenta la ejecución que acaba de terminar.
            CANDIDATES="$TRIGGER_RUN"
          else
            # A mano: las últimas CI correctas de main, de la más reciente a la más antigua.
            # El despliegue manual del 2026-10-22 no encontró ninguna ejecución con esta consulta filtrada
            # por `status=success` (en local sí la devolvía): se filtra por conclusión con jq y, si no
            # queda ninguna, el job falla en vez de dar por buena una lista vacía.
            # De push o lanzadas a mano en main (las dos publican imagen y build).
            CANDIDATES="$(gh api "repos/$REPO/actions/workflows/ci.yml/runs?branch=main&per_page=50" \
              --jq '.workflow_runs[] | select(.conclusion == "success" and (.event == "push" or .event == "workflow_dispatch")) | .id')"
            if [ -z "$CANDIDATES" ]; then
              echo "::error::No se encontró ninguna CI correcta de main de la que desplegar."
              exit 1
            fi
          fi

          # Primera ejecución candidata que tiene (sin caducar) el artefacto pedido.
          run_with() {
            local run count
            for run in $CANDIDATES; do
              count="$(gh api "repos/$REPO/actions/runs/$run/artifacts?per_page=100" \
                --jq "[.artifacts[] | select(.name == \"$1\" and (.expired | not))] | length")"
              if [ "$count" -gt 0 ]; then echo "Artefacto $1: CI $run" >&2; echo "$run"; return; fi
            done
          }
          sha_of() { gh api "repos/$REPO/actions/runs/$1" --jq .head_sha; }

          FRONTEND_RUN="$(run_with frontend-dist)"
          IMAGE_RUN="$(run_with backend-image)"
          FRONTEND_SHA=""; IMAGE_SHA=""; IMAGE_REF=""; SBOM="—"; VULNS="—"
          if [ -n "$FRONTEND_RUN" ]; then FRONTEND_SHA="$(sha_of "$FRONTEND_RUN")"; fi
          if [ -n "$IMAGE_RUN" ]; then
            gh run download "$IMAGE_RUN" --repo "$REPO" --name backend-image --dir image
            IMAGE_REF="$(jq -r .ref image/backend-image.json)"
            IMAGE_SHA="$(jq -r .sha image/backend-image.json)"
            SBOM="$(jq -r '.sbomPackages // "—"' image/backend-image.json)"
            VULNS="$(jq -r '.vulnerabilities // "—"' image/backend-image.json)"
            # La referencia sale de un artefacto: se comprueba su forma antes de usarla.
            if ! [[ "$IMAGE_REF" =~ ^ghcr\.io/[a-z0-9._/-]+@sha256:[0-9a-f]{64}$ ]] || ! [[ "$IMAGE_SHA" =~ ^[0-9a-f]{40}$ ]]; then
              echo "::error::backend-image.json no tiene una referencia de imagen válida."
              exit 1
            fi
          fi

          {
            echo "frontend_run=$FRONTEND_RUN"
            echo "frontend_sha=$FRONTEND_SHA"
            echo "image_run=$IMAGE_RUN"
            echo "image_sha=$IMAGE_SHA"
            echo "image_ref=$IMAGE_REF"
          } >> "$GITHUB_OUTPUT"
          REPO_URL="$GITHUB_SERVER_URL/$REPO"
          if [ -n "$FRONTEND_RUN" ]; then FRONTEND_WHAT='artefacto `frontend-dist`'; else FRONTEND_WHAT='no cambió: no se despliega'; fi
          if [ -n "$IMAGE_REF" ]; then IMAGE_WHAT="\`$IMAGE_REF\`"; else IMAGE_WHAT='no cambió: no hay imagen nueva'; fi
          link_run() { if [ -n "$1" ]; then echo "[#$1]($REPO_URL/actions/runs/$1)"; else echo "—"; fi; }
          link_sha() { if [ -n "$1" ]; then echo "[\`${1:0:7}\`]($REPO_URL/commit/$1)"; else echo "—"; fi; }
          {
            echo "### Qué se despliega — construido y verificado por la CI, sin reconstruir"
            echo ""
            echo "| Pieza | CI | Commit | Qué es |"
            echo "| --- | --- | --- | --- |"
            echo "| Frontend | $(link_run "$FRONTEND_RUN") | $(link_sha "$FRONTEND_SHA") | $FRONTEND_WHAT |"
            echo "| Backend | $(link_run "$IMAGE_RUN") | $(link_sha "$IMAGE_SHA") | $IMAGE_WHAT |"
            echo ""
            if [ -n "$IMAGE_REF" ]; then
              echo "- **Imagen:** Trivy $VULNS vulnerabilidades altas o críticas con corrección · SBOM con $SBOM paquetes."
            fi
            echo "- **Lanzado por:** ${ACTOR:-—} (${GITHUB_EVENT_NAME})."
          } >> "$GITHUB_STEP_SUMMARY"
      - name: Calcular la versión del despliegue
        id: release
        env:
          FRONTEND_SHA: ${{ steps.find.outputs.frontend_sha }}
          IMAGE_SHA: ${{ steps.find.outputs.image_sha }}
          # Las mismas condiciones que los jobs de despliegue de más abajo.
          DEPLOYS_FRONTEND: ${{ steps.find.outputs.frontend_run != '' && vars.CLOUDFLARE_PAGES_PROJECT != '' }}
          DEPLOYS_BACKEND: ${{ github.event_name == 'workflow_dispatch' && inputs.deploy_backend && steps.find.outputs.image_ref != '' && vars.GCP_WIF_PROVIDER != '' }}
        run: |
          set -euo pipefail
          SHAS=()
          if [ "$DEPLOYS_FRONTEND" = true ]; then SHAS+=("$FRONTEND_SHA"); fi
          if [ "$DEPLOYS_BACKEND" = true ]; then SHAS+=("$IMAGE_SHA"); fi
          if [ ${#SHAS[@]} -eq 0 ]; then
            echo "- **Versión:** no se despliega nada, no hay versión nueva." >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi
          # Frontend y backend pueden venir de commits distintos de main: la versión es la del más reciente.
          RELEASE_SHA="${SHAS[0]}"
          for sha in "${SHAS[@]}"; do
            if git merge-base --is-ancestor "$RELEASE_SHA" "$sha"; then RELEASE_SHA="$sha"; fi
          done
          # El script mueve el checkout a ese commit: se ejecuta desde una copia.
          cp .github/scripts/release-info.sh .github/scripts/next-version.sh "$RUNNER_TEMP/"
          mkdir -p release
          bash "$RUNNER_TEMP/release-info.sh" "$RELEASE_SHA" "$GITHUB_REPOSITORY" > release/release.json
          VERSION="$(jq -r .version release/release.json)"
          NEW="$(jq -r .isNew release/release.json)"
          {
            echo "version=$VERSION"
            echo "sha=$RELEASE_SHA"
            echo "new=$NEW"
          } >> "$GITHUB_OUTPUT"
          echo "- **Versión:** \`$VERSION\` ($([ "$NEW" = true ] && echo "nueva, desde $(jq -r '.previous // "el principio"' release/release.json)" || echo 'la misma que ya tenía este commit'); $(jq '.subjects | length' release/release.json) commits)." >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: steps.release.outputs.version != ''
        with:
          name: release-info
          path: release
          retention-days: 1
      # Antes de desplegar nada: la imagen tiene que estar firmada por un workflow de este repositorio.
      - uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v4.1.2
        if: steps.find.outputs.image_ref != ''
      - name: Verificar la firma de la imagen (cosign)
        id: verify
        if: steps.find.outputs.image_ref != ''
        env:
          REF: ${{ steps.find.outputs.image_ref }}
          GH_TOKEN: ${{ github.token }}
        run: |
          echo "$GH_TOKEN" | cosign login ghcr.io -u "$GITHUB_ACTOR" --password-stdin
          cosign verify "$REF" \
            --certificate-identity-regexp "^$GITHUB_SERVER_URL/$GITHUB_REPOSITORY/" \
            --certificate-oidc-issuer https://token.actions.githubusercontent.com > /dev/null
          echo "- **Firma:** ✅ verificada con cosign (identidad: un workflow de este repositorio)." >> "$GITHUB_STEP_SUMMARY"
      - name: Métricas
        if: always()
        run: |
          mkdir -p metrics
          jq -n --arg signature "${{ steps.verify.outcome }}" '{} + (if $signature == "success" then {signatureVerified: true} elif $signature == "failure" then {signatureVerified: false} else {} end)' > metrics/source.json
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always()
        with:
          name: metrics-source
          path: metrics
          retention-days: 1

  # ───────────────────────────── Frontend ─────────────────────────────
  frontend-deploy:
    name: 🚀 Cloudflare Pages
    needs: source
    # Hasta que exista el proyecto en Cloudflare se omite, en vez de fallar en cada push.
    if: needs.source.outputs.frontend-run != '' && vars.CLOUDFLARE_PAGES_PROJECT != ''
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: read
      actions: read
    steps:
      # Solo por el script de configuración, en el mismo commit del que salió el build.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.source.outputs.frontend-sha }}
          sparse-checkout: portfolio-frontend/tools
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '22'
      - name: Descargar el build que verificó la CI
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: frontend-dist
          path: dist
          run-id: ${{ needs.source.outputs.frontend-run }}
          github-token: ${{ github.token }}
      # No es reconstruir: config.json y la CSP son la configuración del entorno, que el build lee
      # al arrancar. Sin API_BASE_URL queda la dirección por defecto y el sitio funciona en modo demo.
      - name: Apuntar el sitio a la API del entorno
        if: vars.API_BASE_URL != ''
        env:
          API_BASE_URL: ${{ vars.API_BASE_URL }}
        run: node portfolio-frontend/tools/write-deploy-config.mjs dist
      # Los datos de la vista «Pipeline CI/CD»: lo último publicado en la rama badges (la CI acaba de
      # escribirlo). Es un archivo de datos, como config.json; si no se puede leer, queda el del build.
      - name: Incluir el estado del pipeline
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if gh api "repos/$GITHUB_REPOSITORY/contents/pipeline-status.json?ref=badges" -H "Accept: application/vnd.github.raw" > status.json \
            && jq -e '.schema == 1' status.json > /dev/null; then
            cp status.json dist/pipeline-status.json
            echo "Estado del pipeline actualizado."
          else
            echo "::warning::No se pudo leer pipeline-status.json de la rama badges: se despliega con el del build."
          fi
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: release-info
          path: release
      # Como config.json: un archivo del entorno, no un cambio del build. Un build anterior a esta
      # herramienta se despliega igual, sin versión visible.
      - name: Escribir la versión del sitio (version.json)
        run: |
          if [ -f portfolio-frontend/tools/write-version.mjs ]; then
            node portfolio-frontend/tools/write-version.mjs dist release/release.json
          else
            echo "::warning::El build es anterior a version.json: el sitio no mostrará su versión."
          fi
      - name: Desplegar
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          PROJECT: ${{ vars.CLOUDFLARE_PAGES_PROJECT }}
          BUILD_SHA: ${{ needs.source.outputs.frontend-sha }}
          API_BASE_URL: ${{ vars.API_BASE_URL }}
          VERSION: ${{ needs.source.outputs.version }}
        run: |
          set -o pipefail
          npx --yes "wrangler@$WRANGLER_VERSION" pages deploy dist --project-name="$PROJECT" --branch=main \
            --commit-hash="$BUILD_SHA" 2>&1 | tee wrangler.log
          URL="$(grep -oE 'https://[a-z0-9-]+\.[a-z0-9-]+\.pages\.dev' wrangler.log | tail -n 1)"
          {
            echo "### Frontend desplegado en Cloudflare Pages"
            echo ""
            echo "- Proyecto: \`$PROJECT\` · versión \`$VERSION\`"
            echo "- Despliegue: ${URL:-(sin URL en la salida de wrangler)}"
            echo "- Build del commit [\`${BUILD_SHA::7}\`]($GITHUB_SERVER_URL/$GITHUB_REPOSITORY/commit/$BUILD_SHA), el mismo artefacto que pasó la CI."
            echo "- Configuración del entorno: API \`${API_BASE_URL:-la del build (modo demo si no responde)}\`."
          } >> "$GITHUB_STEP_SUMMARY"
          # Salud: el despliegue recién creado sirve la aplicación.
          HEALTHY=false
          if [ -n "$URL" ]; then
            for attempt in 1 2 3 4 5 6; do
              if curl -fsS --max-time 15 "$URL/" | grep -q '<app-root'; then HEALTHY=true; break; fi
              sleep 5
            done
          fi
          echo "- Salud: $([ "$HEALTHY" = true ] && echo '✅ responde y sirve la aplicación' || echo '❌ no respondió con la aplicación')." >> "$GITHUB_STEP_SUMMARY"
          # Identificador del despliegue en Cloudflare: es lo que necesita rollback.yml para volver a él.
          SHORT_ID="$(echo "$URL" | sed -E 's#https://([a-z0-9]+)\..*#\1#')"
          DEPLOYMENT_ID="$(curl -fsS -H "Authorization: Bearer $CLOUDFLARE_API_TOKEN" \
            "https://api.cloudflare.com/client/v4/accounts/$CLOUDFLARE_ACCOUNT_ID/pages/projects/$PROJECT/deployments?env=production" \
            | jq -r --arg short "$SHORT_ID" '[.result[] | select(.short_id == $short)][0].id // empty' || true)"
          mkdir -p metrics
          jq -n --arg sha "$BUILD_SHA" --arg url "$URL" --arg id "$DEPLOYMENT_ID" --argjson healthy "$HEALTHY" \
            '{deployedSha: $sha, healthy: $healthy} + (if $url != "" then {deploymentUrl: $url} else {} end) + (if $id != "" then {deploymentId: $id} else {} end)' > metrics/frontend-deploy.json
          if [ "$HEALTHY" != true ]; then
            echo "::error::El despliegue no sirve la aplicación. Para volver a la versión anterior: workflow «Rollback»."
            exit 1
          fi
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always()
        with:
          name: metrics-frontend-deploy
          path: metrics
          retention-days: 1
          if-no-files-found: ignore

  # ───────────────────────────── Backend ─────────────────────────────
  deploy:
    name: 🚀 Cloud Run
    needs: source
    # Solo a mano y pidiéndolo expresamente: la CI nunca despliega el backend por sí sola.
    if: >-
      github.event_name == 'workflow_dispatch' && inputs.deploy_backend
      && needs.source.outputs.image-ref != '' && needs.source.outputs.signature == 'success'
      && vars.GCP_WIF_PROVIDER != ''
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    # La aprobación se configura en el environment (Settings → Environments → production).
    environment:
      name: production
    permissions:
      contents: read
      packages: read
      id-token: write   # OIDC para Workload Identity Federation: sin claves de Google en GitHub
    outputs:
      previous-revision: ${{ steps.deploy.outputs.previous }}
    env:
      REGION: ${{ vars.GCP_REGION }}
      SERVICE: ${{ vars.CLOUD_RUN_SERVICE }}
      TAG: rc-${{ github.run_number }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.source.outputs.image-sha }}
      - uses: google-github-actions/auth@7c6bc770dae815cd3e89ee6cdf493a5fab2cc093 # v3.0.0
        with:
          workload_identity_provider: ${{ vars.GCP_WIF_PROVIDER }}
          service_account: ${{ vars.GCP_DEPLOY_SA }}
      - uses: google-github-actions/setup-gcloud@aa5489c8933f4cc7a4f7d45035b3b1440c9c10db # v3.0.1
      - name: Copiar la imagen verificada a Artifact Registry (mismo digest)
        id: copy
        env:
          IMAGE: ${{ needs.source.outputs.image-ref }}
          IMAGE_SHA: ${{ needs.source.outputs.image-sha }}
          REGISTRY: ${{ vars.GCP_REGION }}-docker.pkg.dev
          TARGET: ${{ vars.GCP_REGION }}-docker.pkg.dev/${{ vars.GCP_PROJECT_ID }}/${{ vars.GCP_ARTIFACT_REPO }}/saas-portfolio-backend
          GHCR_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        # GHCR es privado y Cloud Run no puede descargar de él: se copia la misma imagen, sin
        # reconstruirla. --preserve-digests garantiza que lo desplegado es lo que verificó cosign.
        run: |
          DIGEST="${IMAGE##*@}"
          echo "$GHCR_TOKEN" | skopeo login ghcr.io -u "$GITHUB_ACTOR" --password-stdin
          gcloud auth print-access-token | skopeo login "$REGISTRY" -u oauth2accesstoken --password-stdin
          skopeo copy --all --preserve-digests "docker://$IMAGE" "docker://$TARGET:sha-${IMAGE_SHA:0:7}"
          echo "image=$TARGET@$DIGEST" >> "$GITHUB_OUTPUT"
          echo "digest=$DIGEST" >> "$GITHUB_OUTPUT"
      - name: Crear la revisión sin tráfico, comprobarla y pasarle el tráfico
        id: deploy
        env:
          IMAGE: ${{ steps.copy.outputs.image }}
          VERSION: ${{ needs.source.outputs.version }}
        # Las variables y los secretos de la API ya están en el servicio y se conservan: aquí solo
        # cambian la imagen y APP_VERSION (la versión que devuelve /telemetry/health). Van en la
        # revisión, así que volver a la anterior también devuelve su versión. La revisión nueva no
        # recibe tráfico hasta responder sana en su URL propia.
        run: |
          PREVIOUS="$(gcloud run services describe "$SERVICE" --region "$REGION" --format 'value(status.latestReadyRevisionName)')"
          echo "previous=$PREVIOUS" >> "$GITHUB_OUTPUT"
          gcloud run deploy "$SERVICE" --region "$REGION" --image "$IMAGE" --no-traffic --tag "$TAG" \
            --update-env-vars "APP_VERSION=$VERSION" --quiet
          URL="$(gcloud run services describe "$SERVICE" --region "$REGION" --format json | jq -r --arg t "$TAG" '.status.traffic[] | select(.tag == $t) | .url')"
          for attempt in $(seq 1 24); do
            if curl -fsS -m 10 "$URL/v1/telemetry/health" > /dev/null; then HEALTHY=true; break; fi
            sleep 5
          done
          if [ "${HEALTHY:-}" != "true" ]; then
            echo "::error::La revisión nueva no respondió sana en 2 minutos: el tráfico sigue en $PREVIOUS."
            exit 1
          fi
          gcloud run services update-traffic "$SERVICE" --region "$REGION" --to-tags "$TAG=100" --quiet
          REVISION="$(gcloud run services describe "$SERVICE" --region "$REGION" --format 'value(status.latestReadyRevisionName)')"
          {
            echo "### Desplegado en Cloud Run"
            echo ""
            echo "- **Ahora:** revisión \`$REVISION\` (\`$VERSION\`) con \`$IMAGE\` (firma verificada en el job Origen)."
            echo "- **Antes:** \`${PREVIOUS:-ninguna}\`."
            echo "- **Salud de la revisión nueva:** ✅ \`/v1/telemetry/health\` respondió antes de recibir tráfico."
            echo "- **Para volver atrás:** si las pruebas de humo fallan, el job Rollback lo hace solo. A mano: \`gcloud run services update-traffic $SERVICE --region $REGION --to-revisions=$PREVIOUS=100\`."
          } >> "$GITHUB_STEP_SUMMARY"
          mkdir -p metrics
          jq -n --arg digest "${{ steps.copy.outputs.digest }}" --arg revision "$REVISION" --arg previous "$PREVIOUS" \
            '{digest: $digest, revision: $revision} + (if $previous != "" then {previousRevision: $previous} else {} end)' > metrics/deploy.json
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always()
        with:
          name: metrics-deploy
          path: metrics
          retention-days: 1
          if-no-files-found: ignore

  smoke:
    name: 🧪 Health + smoke
    needs: [source, deploy]
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.source.outputs.image-sha }}
      - name: Pruebas de humo contra la API pública
        env:
          API_BASE_URL: ${{ vars.API_BASE_URL }}
        run: |
          if [ -z "$API_BASE_URL" ]; then
            echo "::error::Falta la variable API_BASE_URL: sin ella no se puede comprobar el despliegue."
            exit 1
          fi
          set -o pipefail
          bash deploy/smoke-test.sh "$API_BASE_URL" | tee -a "$GITHUB_STEP_SUMMARY"

  release:
    name: ✅ Release
    needs: [source, frontend-deploy, deploy, smoke]
    # Una release por despliegue que termina bien: el del frontend, el del backend con sus pruebas de
    # humo, o los dos. Si algo falla no se etiqueta, y el siguiente despliegue reutiliza la versión.
    if: >-
      ${{ always() && needs.source.result == 'success' && needs.source.outputs.release-new == 'true'
          && (needs.frontend-deploy.result == 'success' || needs.smoke.result == 'success')
          && !contains(needs.*.result, 'failure') && !contains(needs.*.result, 'cancelled') }}
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      contents: write
    steps:
      - name: Etiquetar la versión desplegada
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ needs.source.outputs.version }}
          RELEASE_SHA: ${{ needs.source.outputs.release-sha }}
          IMAGE: ${{ needs.smoke.result == 'success' && needs.source.outputs.image-ref || '' }}
          FRONTEND: ${{ needs.frontend-deploy.result == 'success' }}
        run: |
          if gh release view "$VERSION" --repo "$GITHUB_REPOSITORY" > /dev/null 2>&1; then
            echo "### Release — $VERSION ya existe; no se crea otra." >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi
          NOTES="Desplegado:"
          if [ "$FRONTEND" = true ]; then NOTES="$NOTES sitio en Cloudflare Pages"; fi
          if [ -n "$IMAGE" ]; then NOTES="$NOTES$([ "$FRONTEND" = true ] && echo ' y') API en Cloud Run (\`$IMAGE\`)"; fi
          gh release create "$VERSION" --repo "$GITHUB_REPOSITORY" --target "$RELEASE_SHA" --title "$VERSION" \
            --generate-notes --notes "$NOTES."
          echo "### Release $VERSION — $NOTES" >> "$GITHUB_STEP_SUMMARY"

  rollback:
    name: 🚀 Rollback
    needs: [source, deploy, smoke]
    # El despliegue terminó pero las pruebas de humo fallaron: el tráfico vuelve a la revisión
    # anterior, que sigue en Cloud Run (no hay que volver a desplegar nada).
    if: ${{ always() && needs.deploy.result == 'success' && needs.smoke.result == 'failure' && needs.deploy.outputs.previous-revision != '' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    # Sin environment a propósito: volver atrás no debe quedarse esperando una aprobación.
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: google-github-actions/auth@7c6bc770dae815cd3e89ee6cdf493a5fab2cc093 # v3.0.0
        with:
          workload_identity_provider: ${{ vars.GCP_WIF_PROVIDER }}
          service_account: ${{ vars.GCP_DEPLOY_SA }}
      - uses: google-github-actions/setup-gcloud@aa5489c8933f4cc7a4f7d45035b3b1440c9c10db # v3.0.1
      - name: Devolver el tráfico a la revisión anterior
        env:
          PREVIOUS: ${{ needs.deploy.outputs.previous-revision }}
        run: |
          gcloud run services update-traffic "${{ vars.CLOUD_RUN_SERVICE }}" --region "${{ vars.GCP_REGION }}" --to-revisions="$PREVIOUS=100" --quiet
          echo "### Rollback hecho — el tráfico volvió a la revisión \`$PREVIOUS\`." >> "$GITHUB_STEP_SUMMARY"

  # Cierre: duración total y resultado de cada paso, y el estado publicado para el sitio.
  pipeline-status:
    name: ✅ Resumen
    needs: [source, frontend-deploy, deploy, smoke, release, rollback]
    if: ${{ always() && needs.source.result != 'skipped' }}
    continue-on-error: true
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      contents: write
      actions: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          sparse-checkout: |
            portfolio-frontend/tools
            portfolio-frontend/public/pipeline-status.json
            portfolio-frontend/src/app/features/public/delivery/generated
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '22'
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: metrics-*
          path: metrics
      - name: Resumen del despliegue
        env:
          NEEDS: ${{ toJSON(needs) }}
          STARTED: ${{ github.event.workflow_run.run_started_at || github.event.repository.pushed_at }}
        run: |
          {
            echo "### Despliegue en 10 segundos"
            echo ""
            echo "| Paso | Resultado |"
            echo "| --- | --- |"
            echo "$NEEDS" | jq -r 'to_entries[] | "| \(.key) | \(.value.result | if . == "success" then "✅ correcto" elif . == "skipped" then "➖ omitido" else "❌ " + . end) |"'
            echo ""
            echo "- **Firma de la imagen:** ${{ needs.source.outputs.signature == 'success' && '✅ verificada' || needs.source.outputs.signature == 'failure' && '❌ no válida' || 'sin imagen nueva' }}."
            echo "- **Pruebas de humo:** ${{ needs.smoke.result == 'success' && '✅ correctas' || needs.smoke.result == 'failure' && '❌ fallidas (se vuelve a la imagen anterior)' || 'no aplican (sin despliegue del backend)' }}."
            echo "- **Ejecución:** [#$GITHUB_RUN_NUMBER]($GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID)."
          } >> "$GITHUB_STEP_SUMMARY"
      - name: Publicar pipeline-status.json en la rama badges
        env:
          GH_TOKEN: ${{ github.token }}
          RUN_ID: ${{ github.run_id }}
          WORKFLOW_KEY: cd
          # Quién hizo el merge que disparó la CI, o quién lanzó el despliegue a mano.
          DEPLOYED_BY: ${{ github.event.workflow_run.triggering_actor.login || github.actor }}
        run: |
          bash portfolio-frontend/tools/publish-pipeline-status.sh metrics
          DURATION="$(gh api "repos/$GITHUB_REPOSITORY/contents/pipeline-status.json?ref=badges" -H "Accept: application/vnd.github.raw" | jq -r '.workflows.cd.durationSeconds // empty')"
          if [ -n "$DURATION" ]; then echo "- **Duración total:** $((DURATION / 60)) min $((DURATION % 60)) s." >> "$GITHUB_STEP_SUMMARY"; fi

