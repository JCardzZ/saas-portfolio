name: CD

# Build once, deploy many: este workflow NO construye nada. Se dispara cuando la CI termina bien
# en main y despliega exactamente lo que esa ejecución construyó y verificó:
#   - el artefacto `frontend-dist`           → 🚀 Cloudflare Pages
#   - la imagen de GHCR que pasó Trivy       → 🚀 Deploy VPS → 🧪 Health + smoke
#     (artefacto `backend-image`, por digest)   → ✅ Release (semver) o 🚀 Rollback
#
# El despliegue al VPS es SOLO manual (Run workflow → "Desplegar el backend en el VPS") hasta que
# exista el servidor. A mano se despliega lo último que la CI publicó en main: el frontend y la
# imagen pueden venir de ejecuciones distintas, porque cada una solo se construye si cambió.
#
# Secrets:   CLOUDFLARE_API_TOKEN, CLOUDFLARE_ACCOUNT_ID            (frontend)
#            VPS_HOST, VPS_USER, VPS_SSH_KEY, VPS_KNOWN_HOSTS        (backend; el último, recomendado)
# Variables: CLOUDFLARE_PAGES_PROJECT   sin ella el frontend no se despliega
#            API_BASE_URL               dirección pública de la API (p. ej. https://api.ejemplo.dev/v1);
#                                       la usan el frontend y las pruebas de humo
#            VPS_SSH_PORT, VPS_DEPLOY_PATH   opcionales (22 y "saas-portfolio")
# Environment "production": añade ahí revisores obligatorios para que el despliegue pida aprobación.

on:
  workflow_run:
    workflows: [CI]
    types: [completed]
    branches: [main]
  workflow_dispatch:
    inputs:
      deploy_backend:
        description: Desplegar el backend en el VPS
        type: boolean
        default: false

# Los despliegues van de uno en uno y en orden: el siguiente espera, no cancela al que está en curso.
concurrency:
  group: cd-production
  cancel-in-progress: false

permissions:
  contents: read

env:
  WRANGLER_VERSION: 4.148.0

jobs:
  # Decide qué se despliega y de qué ejecución de la CI sale.
  source:
    name: 🔍 Origen
    # Tras la CI: solo si terminó bien, fue por un push a main y es de este repositorio (una CI
    # lanzada a mano o desde un fork no despliega). A mano: siempre.
    if: >-
      ${{ github.event_name == 'workflow_dispatch'
          || (github.event.workflow_run.conclusion == 'success'
              && github.event.workflow_run.event == 'push'
              && github.event.workflow_run.head_branch == 'main'
              && github.event.workflow_run.head_repository.full_name == github.repository) }}
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      contents: read
      actions: read
    outputs:
      frontend-run: ${{ steps.find.outputs.frontend_run }}
      frontend-sha: ${{ steps.find.outputs.frontend_sha }}
      image-run: ${{ steps.find.outputs.image_run }}
      image-sha: ${{ steps.find.outputs.image_sha }}
      image-ref: ${{ steps.find.outputs.image_ref }}
    steps:
      - name: Buscar lo que construyó la CI
        id: find
        env:
          GH_TOKEN: ${{ github.token }}
          TRIGGER_RUN: ${{ github.event.workflow_run.id }}
        run: |
          set -euo pipefail
          REPO="$GITHUB_REPOSITORY"
          if [ -n "$TRIGGER_RUN" ]; then
            # Tras la CI: solo cuenta la ejecución que acaba de terminar.
            CANDIDATES="$TRIGGER_RUN"
          else
            # A mano: las últimas CI correctas de main, de la más reciente a la más antigua.
            CANDIDATES="$(gh api "repos/$REPO/actions/workflows/ci.yml/runs?branch=main&event=push&status=success&per_page=30" --jq '.workflow_runs[].id')"
          fi

          # Primera ejecución candidata que tiene (sin caducar) el artefacto pedido.
          run_with() {
            local run count
            for run in $CANDIDATES; do
              count="$(gh api "repos/$REPO/actions/runs/$run/artifacts?per_page=100" \
                --jq "[.artifacts[] | select(.name == \"$1\" and (.expired | not))] | length")"
              if [ "$count" -gt 0 ]; then echo "$run"; return; fi
            done
          }
          sha_of() { gh api "repos/$REPO/actions/runs/$1" --jq .head_sha; }

          FRONTEND_RUN="$(run_with frontend-dist)"
          IMAGE_RUN="$(run_with backend-image)"
          FRONTEND_SHA=""; IMAGE_SHA=""; IMAGE_REF=""
          if [ -n "$FRONTEND_RUN" ]; then FRONTEND_SHA="$(sha_of "$FRONTEND_RUN")"; fi
          if [ -n "$IMAGE_RUN" ]; then
            gh run download "$IMAGE_RUN" --repo "$REPO" --name backend-image --dir image
            IMAGE_REF="$(jq -r .ref image/backend-image.json)"
            IMAGE_SHA="$(jq -r .sha image/backend-image.json)"
            # La referencia sale de un artefacto: se comprueba su forma antes de usarla.
            if ! [[ "$IMAGE_REF" =~ ^ghcr\.io/[a-z0-9._/-]+@sha256:[0-9a-f]{64}$ ]] || ! [[ "$IMAGE_SHA" =~ ^[0-9a-f]{40}$ ]]; then
              echo "::error::backend-image.json no tiene una referencia de imagen válida."
              exit 1
            fi
          fi

          {
            echo "frontend_run=$FRONTEND_RUN"
            echo "frontend_sha=$FRONTEND_SHA"
            echo "image_run=$IMAGE_RUN"
            echo "image_sha=$IMAGE_SHA"
            echo "image_ref=$IMAGE_REF"
          } >> "$GITHUB_OUTPUT"
          {
            echo "### Qué se despliega (construido y verificado por la CI, sin reconstruir)"
            echo ""
            echo "| Pieza | Ejecución de la CI | Commit | Artefacto |"
            echo "| --- | --- | --- | --- |"
            echo "| Frontend | ${FRONTEND_RUN:-—} | \`${FRONTEND_SHA:0:7}\` | ${FRONTEND_RUN:+frontend-dist} |"
            echo "| Backend | ${IMAGE_RUN:-—} | \`${IMAGE_SHA:0:7}\` | ${IMAGE_REF:+\`$IMAGE_REF\`} |"
            echo ""
            echo "Una pieza sin ejecución no cambió en ese push (o su artefacto caducó) y no se despliega."
          } >> "$GITHUB_STEP_SUMMARY"

  # ───────────────────────────── Frontend ─────────────────────────────
  frontend-deploy:
    name: 🚀 Cloudflare Pages
    needs: source
    # Hasta que exista el proyecto en Cloudflare se omite, en vez de fallar en cada push.
    if: needs.source.outputs.frontend-run != '' && vars.CLOUDFLARE_PAGES_PROJECT != ''
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: read
      actions: read
    steps:
      # Solo por el script de configuración, en el mismo commit del que salió el build.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.source.outputs.frontend-sha }}
          sparse-checkout: portfolio-frontend/tools
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '22'
      - name: Descargar el build que verificó la CI
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: frontend-dist
          path: dist
          run-id: ${{ needs.source.outputs.frontend-run }}
          github-token: ${{ github.token }}
      # No es reconstruir: config.json y la CSP son la configuración del entorno, que el build lee
      # al arrancar. Sin API_BASE_URL queda la dirección por defecto y el sitio funciona en modo demo.
      - name: Apuntar el sitio a la API del entorno
        if: vars.API_BASE_URL != ''
        env:
          API_BASE_URL: ${{ vars.API_BASE_URL }}
        run: node portfolio-frontend/tools/write-deploy-config.mjs dist
      - name: Desplegar
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          PROJECT: ${{ vars.CLOUDFLARE_PAGES_PROJECT }}
          BUILD_SHA: ${{ needs.source.outputs.frontend-sha }}
        run: |
          set -o pipefail
          npx --yes "wrangler@$WRANGLER_VERSION" pages deploy dist --project-name="$PROJECT" --branch=main \
            --commit-hash="$BUILD_SHA" 2>&1 | tee wrangler.log
          URL="$(grep -oE 'https://[a-z0-9-]+\.[a-z0-9-]+\.pages\.dev' wrangler.log | tail -n 1)"
          {
            echo "### Frontend desplegado en Cloudflare Pages"
            echo ""
            echo "- Proyecto: \`$PROJECT\`"
            echo "- Despliegue: ${URL:-(sin URL en la salida de wrangler)}"
            echo "- Build del commit \`${BUILD_SHA::7}\`, el mismo artefacto que pasó la CI."
          } >> "$GITHUB_STEP_SUMMARY"

  # ───────────────────────────── Backend ─────────────────────────────
  deploy:
    name: 🚀 Deploy VPS
    needs: source
    # Solo a mano y pidiéndolo expresamente: la CI nunca despliega el backend por sí sola.
    if: github.event_name == 'workflow_dispatch' && inputs.deploy_backend && needs.source.outputs.image-ref != ''
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    # La aprobación se configura en el environment (Settings → Environments → production).
    environment:
      name: production
    permissions:
      contents: read
      packages: read
    env:
      DEPLOY_PATH: ${{ vars.VPS_DEPLOY_PATH || 'saas-portfolio' }}
    steps:
      # Compose, Caddyfile y script de despliegue del mismo commit que la imagen.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.source.outputs.image-sha }}
      - uses: ./.github/actions/ssh-setup
        with:
          host: ${{ secrets.VPS_HOST }}
          user: ${{ secrets.VPS_USER }}
          key: ${{ secrets.VPS_SSH_KEY }}
          known-hosts: ${{ secrets.VPS_KNOWN_HOSTS }}
          port: ${{ vars.VPS_SSH_PORT || '22' }}
      - name: Copiar Compose y Caddyfile
        run: |
          ssh vps "mkdir -p '$DEPLOY_PATH'"
          scp deploy/docker-compose.yml deploy/Caddyfile "vps:$DEPLOY_PATH/"
      - name: Desplegar la imagen que verificó la CI
        env:
          IMAGE: ${{ needs.source.outputs.image-ref }}
          GHCR_USER: ${{ github.actor }}
          GHCR_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        # Las variables viajan por la entrada estándar junto al script, no en la línea de órdenes
        # del servidor, donde las vería cualquier usuario con `ps`.
        run: |
          {
            printf 'export IMAGE=%q GHCR_USER=%q GHCR_TOKEN=%q DEPLOY_PATH=%q\n' \
              "$IMAGE" "$GHCR_USER" "$GHCR_TOKEN" "$DEPLOY_PATH"
            echo 'set -- deploy'
            cat deploy/remote-deploy.sh
          } | ssh vps 'bash -s'
          echo "### Desplegado en el VPS — \`$IMAGE\`" >> "$GITHUB_STEP_SUMMARY"
      - name: Borrar la clave
        if: always()
        run: rm -f ~/.ssh/deploy_key

  smoke:
    name: 🧪 Health + smoke
    needs: [source, deploy]
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.source.outputs.image-sha }}
      - name: Pruebas de humo contra la API pública
        env:
          API_BASE_URL: ${{ vars.API_BASE_URL }}
        run: |
          if [ -z "$API_BASE_URL" ]; then
            echo "::error::Falta la variable API_BASE_URL: sin ella no se puede comprobar el despliegue."
            exit 1
          fi
          set -o pipefail
          bash deploy/smoke-test.sh "$API_BASE_URL" | tee -a "$GITHUB_STEP_SUMMARY"

  release:
    name: ✅ Release
    needs: [source, smoke]
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.source.outputs.image-sha }}
          fetch-depth: 0
      - name: Etiquetar la versión desplegada
        env:
          GH_TOKEN: ${{ github.token }}
          IMAGE: ${{ needs.source.outputs.image-ref }}
          IMAGE_SHA: ${{ needs.source.outputs.image-sha }}
        run: |
          VERSION="$(bash .github/scripts/next-version.sh)"
          if [ -z "$VERSION" ]; then
            echo "### Release — este commit ya tiene versión; no se crea otra." >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi
          gh release create "$VERSION" --target "$IMAGE_SHA" --title "$VERSION" --generate-notes \
            --notes "Imagen desplegada: \`$IMAGE\`"
          echo "### Release $VERSION — desplegada y sana (\`$IMAGE\`)" >> "$GITHUB_STEP_SUMMARY"

  rollback:
    name: 🚀 Rollback
    needs: [source, deploy, smoke]
    # El despliegue terminó pero las pruebas de humo fallaron: se vuelve a la imagen anterior.
    # (Si falla el propio despliegue, remote-deploy.sh ya vuelve atrás él solo.)
    if: ${{ always() && needs.deploy.result == 'success' && needs.smoke.result == 'failure' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    # Sin environment a propósito: volver atrás no debe quedarse esperando una aprobación.
    env:
      DEPLOY_PATH: ${{ vars.VPS_DEPLOY_PATH || 'saas-portfolio' }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.source.outputs.image-sha }}
      - uses: ./.github/actions/ssh-setup
        with:
          host: ${{ secrets.VPS_HOST }}
          user: ${{ secrets.VPS_USER }}
          key: ${{ secrets.VPS_SSH_KEY }}
          known-hosts: ${{ secrets.VPS_KNOWN_HOSTS }}
          port: ${{ vars.VPS_SSH_PORT || '22' }}
      - name: Volver a la imagen anterior
        run: |
          {
            printf 'export DEPLOY_PATH=%q\n' "$DEPLOY_PATH"
            echo 'set -- rollback'
            cat deploy/remote-deploy.sh
          } | ssh vps 'bash -s'
          echo "### Rollback hecho — el servidor volvió a la imagen anterior, que responde." >> "$GITHUB_STEP_SUMMARY"
      - name: Borrar la clave
        if: always()
        run: rm -f ~/.ssh/deploy_key
