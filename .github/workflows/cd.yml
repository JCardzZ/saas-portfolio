name: CD

# Frontend:  📦 Build frontend → 🚀 Cloudflare Pages
# Backend:   📦 Imagen Docker (GHCR, SBOM, firma cosign) → 🚀 Deploy VPS → 🧪 Health + smoke
#            → ✅ Release (etiqueta semver) si está sano, o 🚀 Rollback a la imagen anterior si no.
#
# Este workflow no repite los tests: da por hecho que main está protegida y que solo recibe
# cambios que pasaron "✅ CI gate".
#
# El despliegue al VPS es SOLO manual (Run workflow → "Desplegar el backend en el VPS") hasta que
# exista el servidor. Un push a main publica la imagen pero nunca la despliega.
#
# Secrets:   CLOUDFLARE_API_TOKEN, CLOUDFLARE_ACCOUNT_ID            (frontend)
#            VPS_HOST, VPS_USER, VPS_SSH_KEY, VPS_KNOWN_HOSTS        (backend; el último, recomendado)
# Variables: CLOUDFLARE_PAGES_PROJECT   sin ella el frontend no se despliega
#            API_BASE_URL               dirección pública de la API (p. ej. https://api.ejemplo.dev/v1);
#                                       la usan el frontend y las pruebas de humo
#            VPS_SSH_PORT, VPS_DEPLOY_PATH   opcionales (22 y "saas-portfolio")
# Environment "production": añade ahí revisores obligatorios para que el despliegue pida aprobación.

on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      deploy_backend:
        description: Desplegar el backend en el VPS
        type: boolean
        default: false

# Los despliegues van de uno en uno y en orden: el siguiente espera, no cancela al que está en curso.
concurrency:
  group: cd-production
  cancel-in-progress: false

permissions:
  contents: read

env:
  WRANGLER_VERSION: 4.148.0
  IMAGE_NAME: saas-portfolio-backend

jobs:
  changes:
    name: 🔍 Cambios
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      # A mano se construye todo; en un push, solo lo que cambió.
      backend: ${{ github.event_name == 'workflow_dispatch' || steps.filter.outputs.backend == 'true' }}
      frontend: ${{ github.event_name == 'workflow_dispatch' || steps.filter.outputs.frontend == 'true' }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: dorny/paths-filter@ceb8a2b8f2d89434be7ff52d3de7ec3738c5cc9d # v4.0.3
        id: filter
        if: github.event_name == 'push'
        with:
          filters: |
            backend:
              - 'portfolio-backend/**'
              - 'portfolio-api-spec/**'
              - 'docs/**'
              - '.dockerignore'
              - '.github/workflows/cd.yml'
            frontend:
              - 'portfolio-frontend/**'
              - '.github/workflows/cd.yml'

  # ───────────────────────────── Frontend ─────────────────────────────
  frontend-build:
    name: 📦 Build frontend
    needs: changes
    if: needs.changes.outputs.frontend == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: portfolio-frontend
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: portfolio-frontend/package-lock.json
      - run: npm ci
      - name: Build de producción
        run: npm run build
      # config.json y la CSP apuntan a la API del entorno. Sin API_BASE_URL queda la dirección
      # por defecto y, si esa API no responde, el sitio funciona en modo demo.
      - name: Apuntar el sitio a la API del entorno
        if: vars.API_BASE_URL != ''
        env:
          API_BASE_URL: ${{ vars.API_BASE_URL }}
        run: node tools/write-deploy-config.mjs dist/portfolio-frontend/browser
      - name: Resumen
        run: node tools/bundle-report.mjs dist/portfolio-frontend/browser >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: frontend-dist
          path: portfolio-frontend/dist/portfolio-frontend/browser
          include-hidden-files: true
          retention-days: 7

  frontend-deploy:
    name: 🚀 Cloudflare Pages
    needs: frontend-build
    # Hasta que exista el proyecto en Cloudflare se omite, en vez de fallar en cada push.
    if: vars.CLOUDFLARE_PAGES_PROJECT != ''
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '22'
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: frontend-dist
          path: dist
      - name: Desplegar
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          PROJECT: ${{ vars.CLOUDFLARE_PAGES_PROJECT }}
        run: |
          set -o pipefail
          npx --yes "wrangler@$WRANGLER_VERSION" pages deploy dist --project-name="$PROJECT" --branch=main 2>&1 | tee wrangler.log
          URL="$(grep -oE 'https://[a-z0-9-]+\.[a-z0-9-]+\.pages\.dev' wrangler.log | tail -n 1)"
          {
            echo "### Frontend desplegado en Cloudflare Pages"
            echo ""
            echo "- Proyecto: \`$PROJECT\`"
            echo "- Despliegue: ${URL:-(sin URL en la salida de wrangler)}"
            echo "- Commit: \`${GITHUB_SHA::7}\`"
          } >> "$GITHUB_STEP_SUMMARY"

  # ───────────────────────────── Backend ─────────────────────────────
  image:
    name: 📦 Imagen Docker
    needs: changes
    if: needs.changes.outputs.backend == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
      packages: write
      # Firma sin claves: cosign pide un certificado de corta duración con la identidad de este workflow.
      id-token: write
    outputs:
      name: ${{ steps.name.outputs.image }}
      digest: ${{ steps.build.outputs.digest }}
      ref: ${{ steps.name.outputs.image }}@${{ steps.build.outputs.digest }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Nombre de la imagen
        id: name
        # GHCR solo admite minúsculas y el nombre del propietario puede llevar mayúsculas.
        run: echo "image=ghcr.io/${GITHUB_REPOSITORY_OWNER,,}/$IMAGE_NAME" >> "$GITHUB_OUTPUT"
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Construir y publicar (con SBOM y procedencia)
        id: build
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          # El contexto es la raíz: la imagen necesita el contrato OpenAPI y docs/.
          context: .
          file: portfolio-backend/Dockerfile
          platforms: linux/amd64
          push: true
          tags: |
            ${{ steps.name.outputs.image }}:sha-${{ github.sha }}
            ${{ steps.name.outputs.image }}:latest
          labels: |
            org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
            org.opencontainers.image.revision=${{ github.sha }}
          # Inventario de componentes (SPDX) y procedencia del build, adjuntos a la imagen como atestaciones.
          sbom: true
          provenance: mode=max
          cache-from: type=gha,scope=backend
          cache-to: type=gha,mode=max,scope=backend
      - uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v4.1.2
      - name: Firmar la imagen (cosign, sin claves)
        env:
          REF: ${{ steps.name.outputs.image }}@${{ steps.build.outputs.digest }}
        # Se firma el digest, no la etiqueta: una etiqueta se puede mover, el digest no.
        run: cosign sign --yes "$REF"
      - name: Resumen
        env:
          IMAGE: ${{ steps.name.outputs.image }}
          DIGEST: ${{ steps.build.outputs.digest }}
        run: |
          {
            echo "### Imagen publicada en GHCR"
            echo ""
            echo "- \`$IMAGE:sha-$GITHUB_SHA\` y \`$IMAGE:latest\`"
            echo "- Digest: \`$DIGEST\`"
            echo "- SBOM y procedencia adjuntos; firmada con cosign."
            echo ""
            echo "Verificar la firma:"
            echo '```'
            echo "cosign verify $IMAGE@$DIGEST \\"
            echo "  --certificate-identity-regexp '^$GITHUB_SERVER_URL/$GITHUB_REPOSITORY/' \\"
            echo "  --certificate-oidc-issuer https://token.actions.githubusercontent.com"
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

  deploy:
    name: 🚀 Deploy VPS
    needs: image
    # Solo a mano y pidiéndolo expresamente: un push a main nunca despliega.
    if: github.event_name == 'workflow_dispatch' && inputs.deploy_backend
    runs-on: ubuntu-latest
    timeout-minutes: 15
    # La aprobación se configura en el environment (Settings → Environments → production).
    environment:
      name: production
    permissions:
      contents: read
      packages: read
    env:
      DEPLOY_PATH: ${{ vars.VPS_DEPLOY_PATH || 'saas-portfolio' }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: ./.github/actions/ssh-setup
        with:
          host: ${{ secrets.VPS_HOST }}
          user: ${{ secrets.VPS_USER }}
          key: ${{ secrets.VPS_SSH_KEY }}
          known-hosts: ${{ secrets.VPS_KNOWN_HOSTS }}
          port: ${{ vars.VPS_SSH_PORT || '22' }}
      - name: Copiar Compose y Caddyfile
        run: |
          ssh vps "mkdir -p '$DEPLOY_PATH'"
          scp deploy/docker-compose.yml deploy/Caddyfile "vps:$DEPLOY_PATH/"
      - name: Desplegar la imagen
        env:
          IMAGE: ${{ needs.image.outputs.ref }}
          GHCR_USER: ${{ github.actor }}
          GHCR_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        # Las variables viajan por la entrada estándar junto al script, no en la línea de órdenes
        # del servidor, donde las vería cualquier usuario con `ps`.
        run: |
          {
            printf 'export IMAGE=%q GHCR_USER=%q GHCR_TOKEN=%q DEPLOY_PATH=%q\n' \
              "$IMAGE" "$GHCR_USER" "$GHCR_TOKEN" "$DEPLOY_PATH"
            echo 'set -- deploy'
            cat deploy/remote-deploy.sh
          } | ssh vps 'bash -s'
          echo "### Desplegado en el VPS — \`$IMAGE\`" >> "$GITHUB_STEP_SUMMARY"
      - name: Borrar la clave
        if: always()
        run: rm -f ~/.ssh/deploy_key

  smoke:
    name: 🧪 Health + smoke
    needs: deploy
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Pruebas de humo contra la API pública
        env:
          API_BASE_URL: ${{ vars.API_BASE_URL }}
        run: |
          if [ -z "$API_BASE_URL" ]; then
            echo "::error::Falta la variable API_BASE_URL: sin ella no se puede comprobar el despliegue."
            exit 1
          fi
          set -o pipefail
          bash deploy/smoke-test.sh "$API_BASE_URL" | tee -a "$GITHUB_STEP_SUMMARY"

  release:
    name: ✅ Release
    needs: [image, smoke]
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - name: Etiquetar la versión desplegada
        env:
          GH_TOKEN: ${{ github.token }}
          IMAGE: ${{ needs.image.outputs.ref }}
        run: |
          VERSION="$(bash .github/scripts/next-version.sh)"
          if [ -z "$VERSION" ]; then
            echo "### Release — este commit ya tiene versión; no se crea otra." >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi
          gh release create "$VERSION" --target "$GITHUB_SHA" --title "$VERSION" --generate-notes \
            --notes "Imagen desplegada: \`$IMAGE\`"
          echo "### Release $VERSION — desplegada y sana (\`$IMAGE\`)" >> "$GITHUB_STEP_SUMMARY"

  rollback:
    name: 🚀 Rollback
    needs: [deploy, smoke]
    # El despliegue terminó pero las pruebas de humo fallaron: se vuelve a la imagen anterior.
    # (Si falla el propio despliegue, remote-deploy.sh ya vuelve atrás él solo.)
    if: ${{ always() && needs.deploy.result == 'success' && needs.smoke.result == 'failure' }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    # Sin environment a propósito: volver atrás no debe quedarse esperando una aprobación.
    env:
      DEPLOY_PATH: ${{ vars.VPS_DEPLOY_PATH || 'saas-portfolio' }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: ./.github/actions/ssh-setup
        with:
          host: ${{ secrets.VPS_HOST }}
          user: ${{ secrets.VPS_USER }}
          key: ${{ secrets.VPS_SSH_KEY }}
          known-hosts: ${{ secrets.VPS_KNOWN_HOSTS }}
          port: ${{ vars.VPS_SSH_PORT || '22' }}
      - name: Volver a la imagen anterior
        run: |
          {
            printf 'export DEPLOY_PATH=%q\n' "$DEPLOY_PATH"
            echo 'set -- rollback'
            cat deploy/remote-deploy.sh
          } | ssh vps 'bash -s'
          echo "### Rollback hecho — el servidor volvió a la imagen anterior, que responde." >> "$GITHUB_STEP_SUMMARY"
      - name: Borrar la clave
        if: always()
        run: rm -f ~/.ssh/deploy_key
