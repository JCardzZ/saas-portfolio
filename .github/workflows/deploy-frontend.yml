name: Deploy frontend (Cloudflare Pages)

# Secrets:   CLOUDFLARE_API_TOKEN (permiso "Cloudflare Pages: Edit"), CLOUDFLARE_ACCOUNT_ID
# Variables: CLOUDFLARE_PAGES_PROJECT (nombre del proyecto de Pages; sin ella no se despliega)
#            API_BASE_URL (p. ej. https://api.ejemplo.dev/v1; sin ella el sitio se publica con la
#            dirección por defecto y, si esa API no responde, funciona en modo demo)

on:
  push:
    branches: [main]
    paths:
      - 'portfolio-frontend/**'
      - '.github/workflows/deploy-frontend.yml'
  workflow_dispatch:

# Los despliegues van en orden y no se pisan: el último en entrar espera al anterior.
concurrency:
  group: deploy-frontend
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  deploy:
    name: Build y despliegue
    # Hasta que exista el proyecto en Cloudflare, el workflow no hace nada (en vez de fallar en cada push).
    if: vars.CLOUDFLARE_PAGES_PROJECT != ''
    runs-on: ubuntu-latest
    timeout-minutes: 20
    environment:
      name: production-frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: portfolio-frontend/package-lock.json
      - name: Dependencias
        working-directory: portfolio-frontend
        run: npm ci
      # No se publica nada que no pase sus tests, aunque el push haya llegado a main sin PR.
      - name: Tests
        working-directory: portfolio-frontend
        run: npx ng test --watch=false --browsers=ChromeHeadlessCI
      - name: Build de producción
        working-directory: portfolio-frontend
        run: npm run build
      - name: Apuntar el sitio a la API del entorno
        if: vars.API_BASE_URL != ''
        working-directory: portfolio-frontend
        env:
          API_BASE_URL: ${{ vars.API_BASE_URL }}
        run: node tools/write-deploy-config.mjs dist/portfolio-frontend/browser
      - name: Desplegar en Cloudflare Pages
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          command: pages deploy portfolio-frontend/dist/portfolio-frontend/browser --project-name=${{ vars.CLOUDFLARE_PAGES_PROJECT }} --branch=main
