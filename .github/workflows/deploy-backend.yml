name: Deploy backend (GHCR + VPS)

# En cada push a main que toque el backend: tests, imagen Docker y publicación en GHCR
# (etiquetas sha-<commit> y latest). No necesita ningún secret propio.
#
# El despliegue al servidor es SOLO manual (Run workflow → "Desplegar en el VPS"), hasta que
# exista el VPS. Necesita:
#   Secrets:   VPS_HOST, VPS_USER, VPS_SSH_KEY (clave privada con acceso al servidor)
#              VPS_KNOWN_HOSTS (recomendado: salida de `ssh-keyscan <host>`, comprobada por ti;
#              sin él la clave del servidor se acepta a ciegas en cada despliegue)
#   Variables: VPS_SSH_PORT (por defecto 22), VPS_DEPLOY_PATH (por defecto saas-portfolio, en el home)
# y, en el servidor, Docker con Compose v2 y un .env creado a partir de deploy/.env.example.

on:
  push:
    branches: [main]
    paths:
      - 'portfolio-backend/**'
      - 'portfolio-api-spec/**'
      - 'docs/**'
      - '.dockerignore'
      - '.github/workflows/deploy-backend.yml'
  workflow_dispatch:
    inputs:
      deploy:
        description: Desplegar en el VPS tras publicar la imagen
        type: boolean
        default: false

concurrency:
  group: deploy-backend
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  test:
    name: Tests
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - uses: gradle/actions/setup-gradle@v4
      - name: Tests
        working-directory: portfolio-backend
        run: ./gradlew test --no-daemon

  image:
    name: Imagen en GHCR
    needs: test
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
      packages: write
    outputs:
      ref: ${{ steps.name.outputs.image }}:sha-${{ github.sha }}
    steps:
      - uses: actions/checkout@v4
      - name: Nombre de la imagen
        id: name
        # GHCR solo admite minúsculas y el nombre del propietario puede llevar mayúsculas.
        run: echo "image=ghcr.io/${GITHUB_REPOSITORY_OWNER,,}/saas-portfolio-backend" >> "$GITHUB_OUTPUT"
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Construir y publicar
        uses: docker/build-push-action@v6
        with:
          # El contexto es la raíz: la imagen necesita el contrato OpenAPI y docs/.
          context: .
          file: portfolio-backend/Dockerfile
          platforms: linux/amd64
          push: true
          tags: |
            ${{ steps.name.outputs.image }}:sha-${{ github.sha }}
            ${{ steps.name.outputs.image }}:latest
          labels: |
            org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
            org.opencontainers.image.revision=${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  deploy:
    name: Desplegar en el VPS
    needs: image
    # Solo a mano y pidiéndolo expresamente: un push a main nunca despliega.
    if: github.event_name == 'workflow_dispatch' && inputs.deploy
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment:
      name: production-backend
    permissions:
      contents: read
      packages: read
    env:
      VPS_HOST: ${{ secrets.VPS_HOST }}
      VPS_USER: ${{ secrets.VPS_USER }}
      VPS_SSH_PORT: ${{ vars.VPS_SSH_PORT || '22' }}
      DEPLOY_PATH: ${{ vars.VPS_DEPLOY_PATH || 'saas-portfolio' }}
    steps:
      - uses: actions/checkout@v4
      - name: Preparar SSH
        env:
          VPS_SSH_KEY: ${{ secrets.VPS_SSH_KEY }}
          VPS_KNOWN_HOSTS: ${{ secrets.VPS_KNOWN_HOSTS }}
        run: |
          if [ -z "$VPS_HOST" ] || [ -z "$VPS_USER" ] || [ -z "$VPS_SSH_KEY" ]; then
            echo "::error::Faltan los secrets VPS_HOST, VPS_USER o VPS_SSH_KEY."
            exit 1
          fi
          install -m 700 -d ~/.ssh
          printf '%s\n' "$VPS_SSH_KEY" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key
          if [ -n "$VPS_KNOWN_HOSTS" ]; then
            printf '%s\n' "$VPS_KNOWN_HOSTS" > ~/.ssh/known_hosts
          else
            echo "::warning::Sin VPS_KNOWN_HOSTS la clave del servidor se acepta sin comprobar. Añade ese secret."
            ssh-keyscan -p "$VPS_SSH_PORT" "$VPS_HOST" > ~/.ssh/known_hosts
          fi
          {
            echo "Host vps"
            echo "  HostName $VPS_HOST"
            echo "  User $VPS_USER"
            echo "  Port $VPS_SSH_PORT"
            echo "  IdentityFile ~/.ssh/deploy_key"
            echo "  IdentitiesOnly yes"
            echo "  StrictHostKeyChecking yes"
            echo "  BatchMode yes"
          } > ~/.ssh/config
      - name: Copiar Compose y Caddyfile
        run: |
          ssh vps "mkdir -p '$DEPLOY_PATH'"
          scp deploy/docker-compose.yml deploy/Caddyfile "vps:$DEPLOY_PATH/"
      - name: Desplegar, comprobar /v1/telemetry/health y volver atrás si falla
        env:
          IMAGE: ${{ needs.image.outputs.ref }}
          GHCR_USER: ${{ github.actor }}
          GHCR_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        # Las variables viajan por la entrada estándar junto al script, no en la línea de órdenes
        # del servidor, donde las vería cualquier usuario con `ps`.
        run: |
          {
            printf 'export IMAGE=%q GHCR_USER=%q GHCR_TOKEN=%q DEPLOY_PATH=%q\n' \
              "$IMAGE" "$GHCR_USER" "$GHCR_TOKEN" "$DEPLOY_PATH"
            cat deploy/remote-deploy.sh
          } | ssh vps 'bash -s'
      - name: Borrar la clave
        if: always()
        run: rm -f ~/.ssh/deploy_key
