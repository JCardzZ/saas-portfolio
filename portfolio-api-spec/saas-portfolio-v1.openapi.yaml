openapi: 3.0.3
info:
  title: Portfolio Platform API
  description: |
    Contract-first API for the portfolio platform: content management, a retrieval-augmented
    assistant, the architecture studio and live telemetry.

    Errors follow RFC 7807 (Problem Details).
  version: 1.0.0

servers:
  - url: http://localhost:8080/v1
    description: Local Sandbox Environment

tags:
  - name: Auth & RBAC
  - name: Admin - Users
  - name: Admin - Technologies CMS
  - name: Admin - Projects CMS
  - name: Admin - Architecture C4 CMS
  - name: Admin - Technical Blog CMS
  - name: Admin - Media Demos CMS
  - name: Admin - Infrastructure & GitOps
  - name: Admin - Chaos Engineering & Resilience
  - name: Recruiter Radar & Ingress
  - name: Telemetry & Observability
  - name: Applied AI (RAG)
  - name: Public Catalog & Showcases
  - name: Profile
  - name: Architecture Studio
  - name: Feature Flags
  - name: System Design
  - name: MCP

paths:
  /auth/token:
    post:
      tags: [Auth & RBAC]
      summary: Issue OAuth2 / JWT Access Token
      operationId: generateToken
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/TokenRequest'
      responses:
        '200':
          description: Token issued successfully.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TokenResponse'
        '400':
          $ref: '#/components/responses/BadRequestError'
        '401':
          $ref: '#/components/responses/UnauthorizedError'
        '429':
          $ref: '#/components/responses/RateLimitError'

  /auth/validate:
    get:
      tags: [Auth & RBAC]
      summary: Validate Token & Inspect RBAC Claims
      operationId: validateToken
      security: [{ BearerAuth: [] }]
      responses:
        '200':
          description: Token is valid and active.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TokenIntrospection'
        '401':
          $ref: '#/components/responses/UnauthorizedError'

  /auth/login:
    post:
      tags: [Auth & RBAC]
      summary: Sign a person in with e-mail and password
      description: >
        Returns a short-lived access token and a refresh token. Attempts are limited per source
        address. A wrong e-mail and a wrong password give the same 401, and a deactivated account
        cannot sign in.
      operationId: loginUser
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/LoginRequest'
      responses:
        '200':
          description: Signed in.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SessionResponse'
        '400':
          $ref: '#/components/responses/BadRequestError'
        '401':
          $ref: '#/components/responses/UnauthorizedError'
        '429':
          $ref: '#/components/responses/RateLimitError'

  /auth/refresh:
    post:
      tags: [Auth & RBAC]
      summary: Exchange a refresh token for a new session
      description: >
        The refresh token is single-use: it is revoked and replaced on every call. Presenting one
        that was already used revokes every session of that person.
      operationId: refreshSession
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RefreshRequest'
      responses:
        '200':
          description: Session renewed.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SessionResponse'
        '400':
          $ref: '#/components/responses/BadRequestError'
        '401':
          $ref: '#/components/responses/UnauthorizedError'
        '429':
          $ref: '#/components/responses/RateLimitError'

  /auth/logout:
    post:
      tags: [Auth & RBAC]
      summary: End a session by revoking its refresh token
      description: Always answers 204, whether or not the token was still valid.
      operationId: logoutSession
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RefreshRequest'
      responses:
        '204':
          description: Session ended.
        '400':
          $ref: '#/components/responses/BadRequestError'

  /auth/me:
    get:
      tags: [Auth & RBAC]
      summary: Fetch who the caller is, with their role and permissions
      operationId: currentUser
      security: [{ BearerAuth: [] }]
      responses:
        '200':
          description: The caller.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UserProfile'
        '401':
          $ref: '#/components/responses/UnauthorizedError'

  /admin/roles:
    get:
      tags: [Admin - Users]
      summary: Fetch the roles and the permissions each one grants
      operationId: listRoles
      security: [{ BearerAuth: [] }]
      responses:
        '200':
          description: Roles fetched successfully.
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/RoleDefinition'
        '401':
          $ref: '#/components/responses/UnauthorizedError'
        '403':
          $ref: '#/components/responses/ForbiddenError'

  /admin/users:
    get:
      tags: [Admin - Users]
      summary: Fetch every user account
      operationId: listUsers
      security: [{ BearerAuth: [] }]
      responses:
        '200':
          description: Users fetched successfully.
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/UserAccount'
        '401':
          $ref: '#/components/responses/UnauthorizedError'
        '403':
          $ref: '#/components/responses/ForbiddenError'
    post:
      tags: [Admin - Users]
      summary: Create a user account
      description: There is no public sign-up. The e-mail must be unique.
      operationId: createUser
      security: [{ BearerAuth: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UserCreateRequest'
      responses:
        '201':
          description: User created.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UserAccount'
        '400':
          $ref: '#/components/responses/BadRequestError'
        '401':
          $ref: '#/components/responses/UnauthorizedError'
        '403':
          $ref: '#/components/responses/ForbiddenError'

  /admin/users/{id}:
    put:
      tags: [Admin - Users]
      summary: Change a user's name, role, password or whether the account is active
      description: >
        Only the fields sent are changed. Deactivating an account or changing its password revokes
        its sessions. The last active administrator cannot be deactivated or given another role.
      operationId: updateUser
      security: [{ BearerAuth: [] }]
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: string, maxLength: 36 }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UserUpdateRequest'
      responses:
        '200':
          description: User updated.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UserAccount'
        '400':
          $ref: '#/components/responses/BadRequestError'
        '401':
          $ref: '#/components/responses/UnauthorizedError'
        '403':
          $ref: '#/components/responses/ForbiddenError'
        '404':
          $ref: '#/components/responses/NotFoundError'

  /admin/technologies:
    get:
      tags: [Admin - Technologies CMS]
      summary: List all registered technologies (Admin)
      security: [{ BearerAuth: [] }]
      responses:
        '200':
          description: Technologies list retrieved successfully.
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Technology'
        '401':
          $ref: '#/components/responses/UnauthorizedError'
        '403':
          $ref: '#/components/responses/ForbiddenError'
    post:
      tags: [Admin - Technologies CMS]
      summary: Add new technology or tool
      security: [{ BearerAuth: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/TechnologyRequest'
      responses:
        '201':
          description: Technology created successfully.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Technology'
        '400':
          $ref: '#/components/responses/BadRequestError'
        '401':
          $ref: '#/components/responses/UnauthorizedError'
        '403':
          $ref: '#/components/responses/ForbiddenError'

  /admin/technologies/{id}:
    put:
      tags: [Admin - Technologies CMS]
      summary: Update existing technology
      security: [{ BearerAuth: [] }]
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: string }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/TechnologyRequest'
      responses:
        '200':
          description: Technology updated successfully.
        '400':
          $ref: '#/components/responses/BadRequestError'
        '401':
          $ref: '#/components/responses/UnauthorizedError'
        '404':
          $ref: '#/components/responses/NotFoundError'
    delete:
      tags: [Admin - Technologies CMS]
      summary: Remove technology entry
      security: [{ BearerAuth: [] }]
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: string }
      responses:
        '204':
          description: Deleted successfully.
        '401':
          $ref: '#/components/responses/UnauthorizedError'
        '404':
          $ref: '#/components/responses/NotFoundError'

  /admin/projects:
    get:
      tags: [Admin - Projects CMS]
      summary: List projects with internal engineering metrics
      security: [{ BearerAuth: [] }]
      responses:
        '200':
          description: Projects list retrieved successfully.
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Project'
        '401':
          $ref: '#/components/responses/UnauthorizedError'
    post:
      tags: [Admin - Projects CMS]
      summary: Create new portfolio project
      security: [{ BearerAuth: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ProjectRequest'
      responses:
        '201':
          description: Project created successfully.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Project'
        '400':
          $ref: '#/components/responses/BadRequestError'
        '401':
          $ref: '#/components/responses/UnauthorizedError'

  /admin/projects/{id}:
    put:
      tags: [Admin - Projects CMS]
      summary: Update project details and benchmarks
      security: [{ BearerAuth: [] }]
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: string }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ProjectRequest'
      responses:
        '200':
          description: Project updated.
        '400':
          $ref: '#/components/responses/BadRequestError'
        '404':
          $ref: '#/components/responses/NotFoundError'
    delete:
      tags: [Admin - Projects CMS]
      summary: Delete project
      security: [{ BearerAuth: [] }]
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: string }
      responses:
        '204':
          description: Project removed.
        '404':
          $ref: '#/components/responses/NotFoundError'

  /admin/architecture/diagrams:
    get:
      tags: [Admin - Architecture C4 CMS]
      summary: List registered C4 architecture diagrams
      security: [{ BearerAuth: [] }]
      responses:
        '200':
          description: Architecture diagrams retrieved successfully.
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/ArchitectureDiagram'
    post:
      tags: [Admin - Architecture C4 CMS]
      summary: Upload/Create new C4 Diagram (Mermaid/JSON)
      security: [{ BearerAuth: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ArchitectureDiagramRequest'
      responses:
        '201':
          description: Architecture diagram created successfully.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ArchitectureDiagram'
        '400':
          $ref: '#/components/responses/BadRequestError'

  /admin/architecture/diagrams/{id}:
    put:
      tags: [Admin - Architecture C4 CMS]
      summary: Update C4 Diagram definition
      security: [{ BearerAuth: [] }]
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: string }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ArchitectureDiagramRequest'
      responses:
        '200':
          description: Diagram updated.
        '404':
          $ref: '#/components/responses/NotFoundError'

  /admin/articles:
    post:
      tags: [Admin - Technical Blog CMS]
      summary: Publish new technical article (MarkDown)
      security: [{ BearerAuth: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ArticleRequest'
      responses:
        '201':
          description: Article published successfully.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Article'
        '400':
          $ref: '#/components/responses/BadRequestError'

  /admin/media/videos:
    post:
      tags: [Admin - Media Demos CMS]
      summary: Attach video demo link (Loom, YouTube, MP4)
      security: [{ BearerAuth: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/VideoMediaRequest'
      responses:
        '201':
          description: Video demo attached successfully.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/VideoMedia'
        '400':
          $ref: '#/components/responses/BadRequestError'

  /admin/infrastructure/deployments/trigger:
    post:
      tags: [Admin - Infrastructure & GitOps]
      summary: Trigger Infrastructure Deployment Pipeline
      security: [{ BearerAuth: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [targetService, environment]
              properties:
                targetService: { type: string, example: "portfolio-backend-service" }
                environment: { type: string, enum: [staging, production], example: "production" }
                forceRebuildNative: { type: boolean, default: false }
      responses:
        '202':
          description: GitOps pipeline triggered.
        '400':
          $ref: '#/components/responses/BadRequestError'
        '401':
          $ref: '#/components/responses/UnauthorizedError'

  /admin/infrastructure/cache/purge:
    post:
      tags: [Admin - Infrastructure & GitOps]
      summary: Purge Edge CDN Cache (Cloudflare)
      security: [{ BearerAuth: [] }]
      responses:
        '200':
          description: Cloudflare cache purged globally.
        '401':
          $ref: '#/components/responses/UnauthorizedError'

  /admin/infrastructure/cluster/scale:
    post:
      tags: [Admin - Infrastructure & GitOps]
      summary: Auto-Scale Kubernetes Pod Replicas
      security: [{ BearerAuth: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [deploymentName, replicas]
              properties:
                deploymentName: { type: string, example: "spring-boot-core-deployment" }
                replicas: { type: integer, example: 3 }
      responses:
        '200':
          description: Pod replicas updated.
        '400':
          $ref: '#/components/responses/BadRequestError'

  /admin/infrastructure/chaos/simulate-failure:
    post:
      tags: [Admin - Chaos Engineering & Resilience]
      summary: Simulate Fault Injection (Chaos Engineering)
      security: [{ BearerAuth: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [targetComponent, failureType]
              properties:
                targetComponent: { type: string, enum: [database, redis, event_broker], example: "database" }
                failureType: { type: string, enum: [LATENCY_INJECTION, SERVICE_DOWN], example: "LATENCY_INJECTION" }
                durationSeconds: { type: integer, example: 30 }
      responses:
        '200':
          description: Chaos experiment initiated.
        '400':
          $ref: '#/components/responses/BadRequestError'

  /recruiter/track-ingress:
    post:
      tags: [Recruiter Radar & Ingress]
      summary: Record Recruiter Ingress & Trigger Radar Alert
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/IngressTrackingRequest'
      responses:
        '202':
          description: Event published to RabbitMQ/NATS.
        '400':
          $ref: '#/components/responses/BadRequestError'
        '429':
          $ref: '#/components/responses/RateLimitError'

  /admin/recruiter/visits:
    get:
      tags: [Recruiter Radar & Ingress]
      summary: List High-Priority Recruiter Ingress Audit Logs
      security: [{ BearerAuth: [] }]
      responses:
        '200':
          description: Recruiter visit logs retrieved.
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/RecruiterVisitLog'
        '401':
          $ref: '#/components/responses/UnauthorizedError'

  /telemetry/live-stream:
    get:
      tags: [Telemetry & Observability]
      summary: Stream Real-Time Telemetry (SSE)
      description: |
        Server-Sent Events stream of system telemetry. Each `data:` line carries one
        `TelemetryEvent` serialized as JSON. Lines starting with `:` are keep-alive comments.
        Events never include prompts, client addresses, token subjects or credentials.
      responses:
        '200':
          description: Active Server-Sent Events stream.
          content:
            text/event-stream:
              schema:
                $ref: '#/components/schemas/TelemetryStream'
        '503':
          $ref: '#/components/responses/ServiceUnavailableError'

  /telemetry/health:
    get:
      tags: [Telemetry & Observability]
      summary: Extended System Health & Circuit Breakers
      responses:
        '200':
          description: Health check and circuit status retrieved.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SystemHealthResponse'
        '503':
          $ref: '#/components/responses/ServiceUnavailableError'

  /ai/rag/query:
    post:
      tags: [Applied AI (RAG)]
      summary: Query Codebase & Architecture via AI (RAG)
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AIQueryRequest'
      responses:
        '200':
          description: RAG query answer generated with citations.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AIQueryResponse'
        '400':
          $ref: '#/components/responses/BadRequestError'
        '429':
          $ref: '#/components/responses/RateLimitError'
        '503':
          $ref: '#/components/responses/ServiceUnavailableError'

  /ai/architecture/copilot:
    post:
      tags: [Applied AI (RAG)]
      summary: Ask the architecture copilot about a topology
      description: >
        Sends the question, the topology on the canvas and the most relevant indexed fragments to
        the AI engine and returns recommendations with their trade-offs. The components it proposes
        are limited to the service catalog (or marked as custom) and must be reviewed by the
        person before applying them. Shares the rate limits of the RAG assistant.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ArchitectureCopilotRequest'
      responses:
        '200':
          description: Recommendations generated.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ArchitectureCopilotResponse'
        '400':
          $ref: '#/components/responses/BadRequestError'
        '429':
          $ref: '#/components/responses/RateLimitError'
        '503':
          description: The AI engine is not available.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ProblemDetails'

  /admin/ai/rag/reindex:
    post:
      tags: [Applied AI (RAG)]
      summary: Trigger Vector Re-indexing Pipeline
      security: [{ BearerAuth: [] }]
      responses:
        '202':
          description: Embeddings re-indexing started.
        '401':
          $ref: '#/components/responses/UnauthorizedError'

  /public/technologies:
    get:
      tags: [Public Catalog & Showcases]
      summary: Fetch public technologies matrix
      responses:
        '200':
          description: Public technologies fetched successfully.
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Technology'

  /public/projects:
    get:
      tags: [Public Catalog & Showcases]
      summary: Fetch public project catalog with tech filters
      responses:
        '200':
          description: Public projects fetched successfully.
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Project'

  /public/career-timeline:
    get:
      tags: [Public Catalog & Showcases]
      summary: Fetch career timeline milestones
      description: Milestones in the order they appear in the career story document, most recent first.
      responses:
        '200':
          description: Career milestones fetched successfully.
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/CareerMilestone'

  /public/cv/download:
    get:
      tags: [Public Catalog & Showcases]
      summary: Download the CV as a PDF
      description: >
        PDF generated from the career story document, so it always matches the public timeline.
        `short` is a one-page summary, `full` the detailed CV and `ats` a plain single-column
        version for applicant tracking systems.
      parameters:
        - name: lang
          in: query
          description: Language of the CV.
          schema: { type: string, enum: [es, en], default: es }
        - name: type
          in: query
          description: Variant of the CV.
          schema: { type: string, enum: [short, full, ats], default: full }
        - name: photo
          in: query
          description: >
            Whether the designed variants carry the profile picture (or the initials avatar when
            none has been uploaded). Some selection processes ask for a CV without a photo.
            Ignored by `ats`, which never has one.
          schema: { type: boolean, default: true }
      responses:
        '200':
          description: The CV as a PDF attachment.
          headers:
            Content-Disposition:
              schema: { type: string, example: 'attachment; filename="cv-manuel-cardoza-es-full.pdf"' }
          content:
            application/pdf:
              schema: { type: string, format: binary }
        '400':
          $ref: '#/components/responses/BadRequestError'
        '404':
          $ref: '#/components/responses/NotFoundError'

  /public/profile/photo:
    get:
      tags: [Profile]
      summary: Fetch the profile picture
      responses:
        '200':
          description: The profile picture.
          content:
            image/jpeg:
              schema: { type: string, format: binary }
            image/png:
              schema: { type: string, format: binary }
        '404':
          $ref: '#/components/responses/NotFoundError'

  /admin/profile/photo:
    put:
      tags: [Profile]
      summary: Upload or replace the profile picture
      description: JPEG or PNG, up to 2 MB. It is used by the CV from the next download on.
      security: [{ BearerAuth: [] }]
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              required: [file]
              properties:
                file: { type: string, format: binary }
      responses:
        '204':
          description: Profile picture stored.
        '400':
          $ref: '#/components/responses/BadRequestError'
        '401':
          $ref: '#/components/responses/UnauthorizedError'
    delete:
      tags: [Profile]
      summary: Remove the profile picture
      security: [{ BearerAuth: [] }]
      responses:
        '204':
          description: Profile picture removed (or there was none).
        '401':
          $ref: '#/components/responses/UnauthorizedError'

  /public/architecture/projects:
    get:
      tags: [Architecture Studio]
      summary: List architecture presets and saved projects
      description: Presets first, then saved projects from newest to oldest. Without the graph; fetch one by id for that.
      responses:
        '200':
          description: Projects fetched successfully.
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/ArchitectureProjectSummary'

  /public/architecture/projects/{id}:
    get:
      tags: [Architecture Studio]
      summary: Fetch an architecture project with its whole graph
      parameters:
        - $ref: '#/components/parameters/ArchitectureProjectId'
      responses:
        '200':
          description: Project fetched successfully.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ArchitectureProject'
        '404':
          $ref: '#/components/responses/NotFoundError'

  /public/architecture/catalog:
    get:
      tags: [Architecture Studio]
      summary: Fetch the cloud service catalog
      description: >
        One entry per service and cloud: its name there, its category and an indicative monthly
        cost in USD for the smallest production-grade size. The costs are estimates kept in the
        database, not live prices.
      parameters:
        - name: provider
          in: query
          description: Only the entries of this cloud.
          schema: { type: string, enum: [aws, gcp, azure] }
      responses:
        '200':
          description: Catalog fetched successfully.
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/CloudCatalogItem'
        '400':
          $ref: '#/components/responses/BadRequestError'

  /public/architecture/generate-terraform:
    post:
      tags: [Architecture Studio]
      summary: Compile the Terraform skeleton of a topology
      description: >
        Stateless: nothing is stored. Returns `main.tf` and `variables.tf` for the topology sent.
        The result is a skeleton (resources and dependencies, no arguments) and cannot be applied
        as is. Rate limited per client address.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ArchitectureTopology'
      responses:
        '200':
          description: Terraform generated.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TerraformBundle'
        '400':
          $ref: '#/components/responses/BadRequestError'
        '429':
          $ref: '#/components/responses/RateLimitError'

  /public/architecture/system-design/catalog:
    get:
      tags: [System Design]
      summary: Catalog of the Application view and the non-functional requirements
      description: >
        What can be chosen for each part of a system (client, backend, API style, authentication,
        database, cache, queues, BFF and push) and on which infrastructure pieces each choice can be
        deployed, plus the non-functional requirements that can be asked of it. Behind the
        `studio.system-design` feature flag: while it is off this path answers 404.
      responses:
        '200':
          description: The catalog.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SystemDesignCatalog'
        '404':
          $ref: '#/components/responses/NotFoundError'

  /public/architecture/system-design/evaluate:
    post:
      tags: [System Design]
      summary: Check a system design against its deployment rules and non-functional requirements
      description: >
        Stateless: nothing is stored. Says, piece by piece, what is deployed where it cannot run and
        what the design is missing for the requirements asked of it, with what to do about each.
        Rate limited per client address. Behind the `studio.system-design` feature flag (404 while off).
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SystemDesignRequest'
      responses:
        '200':
          description: The findings; empty when there is nothing to say.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SystemDesignEvaluation'
        '400':
          $ref: '#/components/responses/BadRequestError'
        '404':
          $ref: '#/components/responses/NotFoundError'
        '429':
          $ref: '#/components/responses/RateLimitError'

  /public/architecture/system-design/generate:
    post:
      tags: [System Design]
      summary: Generate the starting files of a system design
      description: >
        Stateless: nothing is stored and nothing is applied. Returns the Terraform skeleton of the
        infrastructure, an initial API contract (OpenAPI for REST, `.proto` for gRPC; none for
        GraphQL or events), a `docker-compose.yml` for local development and a README. They are
        starting points to be completed, not something to deploy as is. Rate limited per client
        address. Behind the `studio.system-design` feature flag (404 while off).
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SystemDesignRequest'
      responses:
        '200':
          description: The generated files and the findings of the design.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SystemDesignBundle'
        '400':
          $ref: '#/components/responses/BadRequestError'
        '404':
          $ref: '#/components/responses/NotFoundError'
        '429':
          $ref: '#/components/responses/RateLimitError'

  /public/mcp/status:
    get:
      tags: [MCP]
      summary: Status of the platform's MCP server
      description: >
        What the web shows about the MCP server at `/mcp`: whether it is serving, the tools it
        publishes (the same list an MCP client gets from `tools/list`), its limits and the latency
        it has measured since it started. No call content is ever exposed. Behind the `mcp.section`
        feature flag: while it is off this path answers 404, like the MCP endpoint itself.
      responses:
        '200':
          description: The status.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/McpStatus'
        '404':
          $ref: '#/components/responses/NotFoundError'

  /public/architecture/pricing:
    post:
      tags: [Architecture Studio]
      summary: Quote the list price of the services of a canvas
      description: >
        Returns, for each service code, the public list price of the SKU the platform maps it to in that cloud.
        The SKU is chosen by the server from a closed table: the caller only names services of the catalog.
        Prices come from the provider's public price API and are cached for 24 hours; if the provider does not
        answer, the last known price is returned as `STALE`. A service without a mapped SKU or a public price
        API is not guessed: it comes back as `UNKNOWN_PRICING` or `UNESTIMATED_ENTERPRISE_LICENSE`.
        Each lookup is announced on `/telemetry/live-stream`. Rate limited per client address.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PricingRequest'
      responses:
        '200':
          description: One quote per distinct service code, in the order received.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PricingResponse'
        '400':
          $ref: '#/components/responses/BadRequestError'
        '429':
          $ref: '#/components/responses/RateLimitError'

  /admin/architecture/projects:
    post:
      tags: [Architecture Studio]
      summary: Save a new architecture project
      description: >-
        Saved projects are listed publicly, so only an administrator can create them. The graph must follow the
        rules of the studio (which piece may feed which, valid ends for each link kind, instances per service);
        a graph that breaks one answers 400.
      security: [{ BearerAuth: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ArchitectureProjectRequest'
      responses:
        '201':
          description: Project saved.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ArchitectureProject'
        '400':
          $ref: '#/components/responses/BadRequestError'
        '401':
          $ref: '#/components/responses/UnauthorizedError'

  /admin/architecture/projects/{id}:
    put:
      tags: [Architecture Studio]
      summary: Update a saved architecture project
      description: Presets are read-only; updating one answers 400, and so does a graph that breaks the rules of the studio.
      security: [{ BearerAuth: [] }]
      parameters:
        - $ref: '#/components/parameters/ArchitectureProjectId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ArchitectureProjectRequest'
      responses:
        '200':
          description: Project updated.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ArchitectureProject'
        '400':
          $ref: '#/components/responses/BadRequestError'
        '401':
          $ref: '#/components/responses/UnauthorizedError'
        '404':
          $ref: '#/components/responses/NotFoundError'

  /public/features:
    get:
      tags: [Feature Flags]
      summary: Fetch the state of every feature flag
      description: >
        The flags the platform knows, each one on or off. A flag nobody has changed is off. The
        frontend reads this once at start-up; an endpoint that belongs to a flag that is off
        answers 404.
      responses:
        '200':
          description: Flags fetched successfully.
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/FeatureFlag'

  /admin/features:
    get:
      tags: [Feature Flags]
      summary: Fetch every feature flag with who changed it last
      security: [{ BearerAuth: [] }]
      responses:
        '200':
          description: Flags fetched successfully.
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/FeatureFlagDetail'
        '401':
          $ref: '#/components/responses/UnauthorizedError'

  /admin/features/audit:
    get:
      tags: [Feature Flags]
      summary: Fetch the latest changes made to the feature flags
      description: The 100 most recent changes, newest first.
      security: [{ BearerAuth: [] }]
      responses:
        '200':
          description: Audit trail fetched successfully.
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/FeatureFlagAuditEntry'
        '401':
          $ref: '#/components/responses/UnauthorizedError'

  /admin/features/{key}:
    put:
      tags: [Feature Flags]
      summary: Turn a feature flag on or off
      description: The change is recorded in the audit trail with the client that made it. An unknown flag answers 404.
      security: [{ BearerAuth: [] }]
      parameters:
        - name: key
          in: path
          required: true
          schema: { type: string, pattern: '^[a-z][a-z0-9.-]{1,62}$', example: "mcp.section" }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/FeatureFlagUpdate'
      responses:
        '200':
          description: Flag updated.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/FeatureFlagDetail'
        '400':
          $ref: '#/components/responses/BadRequestError'
        '401':
          $ref: '#/components/responses/UnauthorizedError'
        '404':
          $ref: '#/components/responses/NotFoundError'

  /public/architecture/c4/{level}:
    get:
      tags: [Public Catalog & Showcases]
      summary: Fetch C4 architecture diagram by level
      parameters:
        - name: level
          in: path
          required: true
          schema: { type: string, enum: [context, container, component, code] }
      responses:
        '200':
          description: C4 Diagram definition fetched successfully.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ArchitectureDiagram'
        '404':
          $ref: '#/components/responses/NotFoundError'

  /public/articles:
    get:
      tags: [Public Catalog & Showcases]
      summary: List public technical engineering articles
      responses:
        '200':
          description: Technical articles fetched successfully.
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Article'

components:
  securitySchemes:
    BearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
    ApiKeyAuth:
      type: apiKey
      in: header
      name: X-API-KEY

  parameters:
    ArchitectureProjectId:
      name: id
      in: path
      required: true
      schema: { type: string, pattern: '^[A-Za-z0-9_-]{1,64}$' }

  schemas:
    FieldError:
      type: object
      required: [field, code, message]
      properties:
        field:
          type: string
          example: "capacity"
        code:
          type: string
          example: "POSITIVE"
        message:
          type: string
          example: "debe ser mayor que 0"

    ProblemDetails:
      type: object
      required: [type, title, status, detail, instance, code, timestamp, traceId]
      properties:
        type:
          type: string
          format: uri
          example: "https://api.example.com/saas-portfolio/errors/validation-error"
        title:
          type: string
          example: "Error de validación"
        status:
          type: integer
          example: 400
        detail:
          type: string
          example: "Uno o más campos no son válidos"
        instance:
          type: string
          example: "/saas-portfolio/api/v1/projects"
        code:
          type: string
          example: "VALIDATION_ERROR"
        timestamp:
          type: string
          format: date-time
          example: "2026-10-03T21:30:00Z"
        traceId:
          type: string
          example: "3f1c9a52-8d4e-4b7a-9c61-2e5f0b7d4a18"
        errors:
          type: array
          items:
            $ref: '#/components/schemas/FieldError'

    TokenRequest:
      type: object
      required: [clientId, clientSecret, grantType]
      properties:
        clientId: { type: string, example: "admin-ui" }
        clientSecret: { type: string, example: "sec_admin_998877" }
        grantType: { type: string, example: "client_credentials" }

    TokenResponse:
      type: object
      properties:
        accessToken: { type: string, example: "eyJhbGciOiJ..." }
        expiresInSeconds: { type: integer, example: 3600 }

    TokenIntrospection:
      type: object
      properties:
        active: { type: boolean, example: true }
        subject: { type: string, example: "usr_admin_principal" }
        roles: { type: array, items: { type: string }, example: ["ROLE_ADMIN"] }

    UserRole:
      type: string
      description: >
        ADMIN can do everything, including managing users and feature flags. EDITOR writes the CMS
        and the Studio. VIEWER only reads the administration.
      enum: [ADMIN, EDITOR, VIEWER]

    LoginRequest:
      type: object
      required: [email, password]
      properties:
        email: { type: string, format: email, maxLength: 254, example: "ana@example.com" }
        password: { type: string, format: password, minLength: 1, maxLength: 72 }

    RefreshRequest:
      type: object
      required: [refreshToken]
      properties:
        refreshToken: { type: string, minLength: 20, maxLength: 200 }

    SessionResponse:
      type: object
      required: [accessToken, expiresInSeconds, refreshToken, refreshExpiresInSeconds, user]
      properties:
        accessToken: { type: string, example: "eyJhbGciOiJ..." }
        expiresInSeconds: { type: integer, example: 900 }
        refreshToken: { type: string, description: "Opaque and single-use. Never a JWT." }
        refreshExpiresInSeconds: { type: integer, example: 604800 }
        user:
          $ref: '#/components/schemas/UserProfile'

    UserProfile:
      type: object
      required: [subject, role, permissions]
      properties:
        subject: { type: string, description: "The user id, or the client id for a machine token.", example: "0b9c1f6e-3d2a-4f6b-9a1e-5d7c8b9a0f11" }
        email: { type: string, format: email, description: "Absent for a machine token." }
        displayName: { type: string, example: "Ana Pérez" }
        role:
          $ref: '#/components/schemas/UserRole'
        permissions:
          type: array
          items: { type: string }
          example: ["cms:read", "cms:write"]

    RoleDefinition:
      type: object
      required: [role, description, permissions]
      properties:
        role:
          $ref: '#/components/schemas/UserRole'
        description: { type: string }
        permissions:
          type: array
          items:
            $ref: '#/components/schemas/PermissionDefinition'

    PermissionDefinition:
      type: object
      required: [code, description]
      properties:
        code: { type: string, example: "cms:write" }
        description: { type: string }

    UserAccount:
      type: object
      required: [id, email, displayName, role, active, createdAt]
      properties:
        id: { type: string, example: "0b9c1f6e-3d2a-4f6b-9a1e-5d7c8b9a0f11" }
        email: { type: string, format: email }
        displayName: { type: string }
        role:
          $ref: '#/components/schemas/UserRole'
        active: { type: boolean }
        createdAt: { type: string, format: date-time }

    UserCreateRequest:
      type: object
      required: [email, displayName, password, role]
      properties:
        email: { type: string, format: email, maxLength: 254 }
        displayName: { type: string, minLength: 1, maxLength: 80 }
        password: { type: string, format: password, minLength: 12, maxLength: 72, description: "12 to 72 characters. Stored only as a BCrypt hash." }
        role:
          $ref: '#/components/schemas/UserRole'

    UserUpdateRequest:
      type: object
      properties:
        displayName: { type: string, minLength: 1, maxLength: 80 }
        password: { type: string, format: password, minLength: 12, maxLength: 72 }
        role:
          $ref: '#/components/schemas/UserRole'
        active: { type: boolean }

    Technology:
      type: object
      properties:
        id: { type: string, example: "tech_java21" }
        name: { type: string, example: "Java 21 (Virtual Threads)" }
        category: { type: string, example: "Backend Frameworks" }
        proficiencyLevel: { type: string, example: "Expert / Staff Level" }
        iconUrl: { type: string, example: "https://cdn.example.com/icons/java.svg" }
        isFeatured: { type: boolean, example: true }

    TechnologyRequest:
      type: object
      required: [name, category, proficiencyLevel, iconUrl]
      properties:
        name: { type: string, example: "Spring Boot 3" }
        category: { type: string, example: "Backend" }
        proficiencyLevel: { type: string, example: "Expert" }
        iconUrl: { type: string, example: "https://cdn.example.com/icons/spring.svg" }
        isFeatured: { type: boolean, example: true }

    Project:
      type: object
      properties:
        id: { type: string, example: "prj_01" }
        title: { type: string, example: "Multi-Cloud Event-Driven SaaS" }
        summary: { type: string, example: "High-throughput microservices SaaS platform." }
        githubRepoUrl: { type: string, example: "https://github.com/user/saas-portfolio" }
        demoVideoUrl: { type: string, example: "https://loom.com/share/12345" }
        technologiesUsed: { type: array, items: { type: string }, example: ["Java 21", "Spring Boot 3", "Angular 18"] }
        metricsImpact: { type: string, example: "Reduced P99 latency to 1.2ms" }

    ProjectRequest:
      type: object
      required: [title, summary, githubRepoUrl]
      properties:
        title: { type: string, example: "Distributed Microservices Engine" }
        summary: { type: string, example: "Event-driven architecture showcase." }
        githubRepoUrl: { type: string, example: "https://github.com/user/saas-portfolio" }
        demoVideoUrl: { type: string, example: "https://loom.com/share/998877" }
        technologiesUsed: { type: array, items: { type: string } }
        metricsImpact: { type: string, example: "99.99% Uptime SLA" }

    CareerMilestone:
      type: object
      required: [period, title, summary]
      properties:
        period: { type: string, example: "2023 - 2025" }
        title: { type: string, example: "Migración a arquitectura hexagonal" }
        role: { type: string, example: "Staff Software Engineer" }
        organization: { type: string, example: "Acme Corp" }
        technologies: { type: array, items: { type: string }, example: ["Java 21", "Spring Boot 3"] }
        summary: { type: string, example: "Qué problema había, qué se hizo y qué resultado tuvo." }

    ArchitectureCopilotRequest:
      type: object
      required: [prompt, cloudProvider, nodes, connections]
      properties:
        prompt: { type: string, maxLength: 1000, example: "¿Cómo hago esta arquitectura más resiliente?" }
        cloudProvider: { type: string, enum: [aws, gcp, azure, oci], description: "`oci` (Oracle Cloud Infrastructure) is only accepted while the `cloud.oracle` feature flag is on." }
        nodes: { type: array, maxItems: 60, items: { $ref: '#/components/schemas/ArchitectureGraphElement' } }
        connections: { type: array, maxItems: 200, items: { $ref: '#/components/schemas/ArchitectureGraphElement' } }

    ArchitectureCopilotResponse:
      type: object
      required: [answer, recommendations]
      properties:
        answer: { type: string, description: "Short answer in Markdown." }
        recommendations:
          type: array
          items:
            $ref: '#/components/schemas/ArchitectureRecommendation'

    ArchitectureRecommendation:
      type: object
      required: [title, pros, cons, additions]
      properties:
        title: { type: string }
        pros: { type: array, items: { type: string } }
        cons: { type: array, items: { type: string } }
        snippetLanguage: { type: string, example: "terraform" }
        snippet: { type: string, description: "Illustrative code or configuration; not verified." }
        additions:
          type: array
          description: Components the recommendation would add to the canvas.
          items:
            $ref: '#/components/schemas/ArchitectureAddition'

    ArchitectureAddition:
      type: object
      required: [code]
      properties:
        code: { type: string, description: "A code of the service catalog, or `custom` for a technology outside it.", example: "queue" }
        name: { type: string, description: "Name of a custom technology.", example: "IPFS" }
        role: { type: string, example: "Cola de reintentos" }
        connectFrom: { type: string, description: "Id of the existing node it should be wired from.", example: "api" }

    CloudCatalogItem:
      type: object
      required: [id, provider, code, name, category, defaultMonthlyCost, isEnterprise]
      properties:
        id: { type: string, example: "aws:nosql" }
        provider: { type: string, enum: [aws, gcp, azure] }
        code: { type: string, description: "Kind of service, shared by its equivalents in every cloud.", example: "nosql" }
        name: { type: string, example: "DynamoDB" }
        category: { type: string, example: "data" }
        defaultMonthlyCost: { type: number, description: "Indicative monthly cost in USD.", example: 5 }
        isEnterprise: { type: boolean, description: "Typically adopted at enterprise scale." }

    FeatureFlag:
      type: object
      required: [key, enabled, description]
      properties:
        key: { type: string, example: "mcp.section" }
        enabled: { type: boolean }
        description: { type: string, description: "What the flag turns on." }

    FeatureFlagDetail:
      type: object
      required: [key, enabled, description]
      properties:
        key: { type: string, example: "mcp.section" }
        enabled: { type: boolean }
        description: { type: string }
        updatedAt: { type: string, format: date-time, description: "Absent while nobody has changed the flag." }
        updatedBy: { type: string, description: "Client that changed it last." }

    FeatureFlagUpdate:
      type: object
      required: [enabled]
      properties:
        enabled: { type: boolean }

    FeatureFlagAuditEntry:
      type: object
      required: [key, enabled, previous, actor, changedAt]
      properties:
        key: { type: string, example: "mcp.section" }
        enabled: { type: boolean, description: "State after the change." }
        previous: { type: boolean, description: "State before the change." }
        actor: { type: string, description: "Client that made the change." }
        changedAt: { type: string, format: date-time }

    ArchitectureGraphElement:
      description: >-
        A node, connection or zone of the canvas. Its shape belongs to the Architecture Studio editor, which validates it
        on load. A connection may carry `kind` (CDC_STREAM, EVENT_BUS, ANALYTICS_SINK or REPLICATION) to say what it moves.
      type: object
      additionalProperties: true

    ArchitectureProjectSummary:
      type: object
      required: [id, title, cloudProvider, isPreset, createdAt]
      properties:
        id: { type: string, example: "legacy-core" }
        title: { type: string, example: "Core legado integrado por colas (Mainframe + MQ + Spring Batch + Lambda + SQS)" }
        description: { type: string }
        cloudProvider: { type: string, enum: [aws, gcp, azure, oci], description: "`oci` (Oracle Cloud Infrastructure) is only accepted while the `cloud.oracle` feature flag is on." }
        isPreset: { type: boolean, description: "Shipped with the platform and read-only." }
        createdAt: { type: string, format: date-time }

    ArchitectureProject:
      allOf:
        - $ref: '#/components/schemas/ArchitectureProjectSummary'
        - type: object
          required: [nodes, connections, zones]
          properties:
            nodes: { type: array, items: { $ref: '#/components/schemas/ArchitectureGraphElement' } }
            connections: { type: array, items: { $ref: '#/components/schemas/ArchitectureGraphElement' } }
            zones: { type: array, items: { $ref: '#/components/schemas/ArchitectureGraphElement' } }
            system:
              $ref: '#/components/schemas/SystemDesign'
            diagnostics:
              type: array
              description: >-
                What the graph rules have to say about this project, node by node. Only present while the
                `studio.smart-rules` feature flag is on. A saved project never carries errors (saving one is
                rejected with 400); warnings do not prevent saving.
              items: { $ref: '#/components/schemas/GraphDiagnostic' }

    GraphDiagnostic:
      type: object
      required: [nodeId, rule, severity, message]
      properties:
        nodeId: { type: string, description: "Node the diagnostic is shown next to.", example: "postgres" }
        rule: { type: string, enum: [connection, link-kind, max-instances, placement, exposure] }
        severity: { type: string, enum: [error, warning] }
        message: { type: string, example: "Riesgo de seguridad: RDS PostgreSQL está en una subred pública, alcanzable desde Internet." }
        suggestion: { type: string, description: "What to do about it.", example: "Muévela a una subred privada y deja en la pública solo el balanceador o el API gateway." }
        from: { type: string, description: "Source node of the connection that causes it, for connection rules." }
        to: { type: string, description: "Target node of the connection that causes it, for connection rules." }

    ArchitectureProjectRequest:
      type: object
      required: [title, cloudProvider, nodes, connections, zones]
      properties:
        title: { type: string, maxLength: 120 }
        description: { type: string, maxLength: 500 }
        cloudProvider: { type: string, enum: [aws, gcp, azure, oci], description: "`oci` (Oracle Cloud Infrastructure) is only accepted while the `cloud.oracle` feature flag is on." }
        nodes: { type: array, maxItems: 60, items: { $ref: '#/components/schemas/ArchitectureGraphElement' } }
        connections: { type: array, maxItems: 200, items: { $ref: '#/components/schemas/ArchitectureGraphElement' } }
        zones: { type: array, maxItems: 24, items: { $ref: '#/components/schemas/ArchitectureGraphElement' } }
        system:
          $ref: '#/components/schemas/SystemDesign'

    McpStatus:
      type: object
      required: [online, endpoint, protocolVersion, server, tools, limits, latency]
      properties:
        online: { type: boolean }
        endpoint: { type: string, description: "Path of the MCP endpoint, relative to the API base URL.", example: "/mcp" }
        protocolVersion: { type: string, example: "2025-11-25" }
        server:
          type: object
          required: [name, version]
          properties:
            name: { type: string, example: "portfolio-platform" }
            version: { type: string, example: "1.0.0" }
        tools: { type: array, items: { $ref: '#/components/schemas/McpToolInfo' } }
        limits:
          type: object
          required: [perClient, windowSeconds, dailyTotal]
          properties:
            perClient: { type: integer, description: "Tool calls allowed per origin in `windowSeconds`.", example: 30 }
            windowSeconds: { type: integer, example: 60 }
            dailyTotal: { type: integer, description: "Tool calls allowed per day across every origin.", example: 2000 }
        latency:
          type: object
          required: [calls]
          description: Measured since the server started. Without calls there are no percentiles.
          properties:
            calls: { type: integer, example: 128 }
            p50Ms: { type: number, example: 14.2 }
            p95Ms: { type: number, example: 240.5 }

    McpToolInfo:
      type: object
      required: [name, title, description, kind, version]
      properties:
        name: { type: string, example: "validar_arquitectura" }
        title: { type: string, example: "Validar una arquitectura" }
        description: { type: string }
        kind: { type: string, description: "read (reads or checks) or generate (returns generated files). No tool writes.", example: "read" }
        version: { type: string, example: "1.0.0" }

    SystemDesign:
      description: >-
        What runs on top of the infrastructure of a project: the choice made in each category of the
        Application view, the infrastructure node each piece is deployed on and the non-functional
        requirements asked of the system. Optional: a project without it is only infrastructure.
      type: object
      required: [choices, deployments, nfr]
      properties:
        choices:
          type: object
          description: "Category id → option id, both from the system design catalog."
          maxProperties: 16
          additionalProperties: { type: string, maxLength: 48 }
          example: { client: web-spa, backend: spring-boot, api: rest, auth: jwt-own, database: postgresql }
        deployments:
          type: object
          description: "Category id → id of the infrastructure node that piece is deployed on."
          maxProperties: 16
          additionalProperties: { type: string, maxLength: 48 }
          example: { backend: api, database: postgres }
        nfr:
          $ref: '#/components/schemas/NonFunctionalRequirements'

    NonFunctionalRequirements:
      type: object
      properties:
        users: { type: number, description: "Monthly active users.", example: 50000 }
        rps: { type: number, description: "Requests per second at peak.", example: 800 }
        latencyMs: { type: number, description: "Target p95 latency, in milliseconds.", example: 150 }
        availability: { type: number, description: "Target availability, in percent: 99, 99.9, 99.95 or 99.99.", example: 99.9 }
        budgetUsd: { type: number, description: "Monthly cloud budget, in USD.", example: 500 }
        compliance:
          type: array
          maxItems: 4
          items: { type: string, maxLength: 16 }
          description: "Regulations that apply: `pci` (card payments), `health` (health data)."

    SystemDesignRequest:
      type: object
      required: [cloudProvider, nodes, connections, system]
      properties:
        cloudProvider: { type: string, maxLength: 16, description: "aws, gcp, azure or, while its flag is on, oci.", example: aws }
        nodes: { type: array, maxItems: 60, items: { $ref: '#/components/schemas/ArchitectureGraphElement' } }
        connections: { type: array, maxItems: 200, items: { $ref: '#/components/schemas/ArchitectureGraphElement' } }
        system:
          $ref: '#/components/schemas/SystemDesign'
        estimatedMonthlyCostUsd:
          type: number
          minimum: 0
          description: "Monthly cost estimate of the infrastructure, if the caller has one. Without it the budget is not judged."

    SystemDesignFinding:
      type: object
      required: [rule, kind, severity, message]
      properties:
        rule: { type: string, example: "rps-cache" }
        kind: { type: string, description: "input (what was asked is not valid), deployment or nfr.", example: "nfr" }
        severity: { type: string, description: "error or warning.", example: "warning" }
        category: { type: string, description: "Category of the Application view it refers to.", example: "cache" }
        nodeId: { type: string, description: "Infrastructure node it refers to." }
        message: { type: string, example: "Con 800 peticiones por segundo y sin caché, todas las lecturas llegan a la base de datos." }
        suggestion: { type: string, example: "Elige una caché: Redis para datos por usuario, el borde para lo que es igual para todos." }

    SystemDesignEvaluation:
      type: object
      required: [findings]
      properties:
        findings: { type: array, items: { $ref: '#/components/schemas/SystemDesignFinding' } }

    SystemDesignFile:
      type: object
      required: [path, language, content]
      properties:
        path: { type: string, example: "openapi.yaml" }
        language: { type: string, description: "hcl, yaml, protobuf or markdown.", example: "yaml" }
        content: { type: string }

    SystemDesignBundle:
      type: object
      required: [files, findings]
      properties:
        files: { type: array, items: { $ref: '#/components/schemas/SystemDesignFile' } }
        findings: { type: array, items: { $ref: '#/components/schemas/SystemDesignFinding' } }

    SystemDesignCatalog:
      type: object
      required: [categories, requirements, compliance]
      properties:
        categories: { type: array, items: { $ref: '#/components/schemas/SystemDesignCategory' } }
        requirements: { type: array, items: { $ref: '#/components/schemas/SystemDesignRequirement' } }
        compliance: { type: array, items: { $ref: '#/components/schemas/SystemDesignComplianceOption' } }

    SystemDesignCategory:
      type: object
      required: [id, name, question, optional, options]
      properties:
        id: { type: string, example: "database" }
        name: { type: string, example: "Base de datos" }
        question: { type: string, example: "¿Dónde viven los datos?" }
        optional: { type: boolean, description: "An optional category may be left without a choice." }
        options: { type: array, items: { $ref: '#/components/schemas/SystemDesignOption' } }

    SystemDesignOption:
      type: object
      required: [id, name, summary, deploysOn]
      properties:
        id: { type: string, example: "postgresql" }
        name: { type: string, example: "Relacional · PostgreSQL" }
        summary: { type: string }
        deploysOn: { type: array, items: { type: string }, description: "Infrastructure node types this choice can be deployed on; empty if it is not deployed in the cloud." }
        notDeployed: { type: string, description: "Why it is not deployed, when it is not." }
        contract: { type: string, description: "Contract generated for this API style: openapi or proto." }

    SystemDesignRequirement:
      type: object
      required: [field, name, unit, min, max]
      properties:
        field: { type: string, example: "rps" }
        name: { type: string, example: "Peticiones por segundo en el pico" }
        unit: { type: string, example: "req/s" }
        min: { type: number }
        max: { type: number }
        choices: { type: array, items: { type: number }, description: "Allowed values, when it is not a free number." }
        help: { type: string }

    SystemDesignComplianceOption:
      type: object
      required: [id, name]
      properties:
        id: { type: string, example: "pci" }
        name: { type: string, example: "Pagos con tarjeta (PCI DSS)" }
        help: { type: string }

    ArchitectureTopology:
      type: object
      required: [cloudProvider, nodes, connections]
      properties:
        cloudProvider: { type: string, enum: [aws, gcp, azure, oci], description: "`oci` (Oracle Cloud Infrastructure) is only accepted while the `cloud.oracle` feature flag is on." }
        nodes: { type: array, maxItems: 60, items: { $ref: '#/components/schemas/ArchitectureGraphElement' } }
        connections: { type: array, maxItems: 200, items: { $ref: '#/components/schemas/ArchitectureGraphElement' } }

    TerraformBundle:
      type: object
      required: [mainTf, variablesTf]
      properties:
        mainTf: { type: string }
        variablesTf: { type: string }

    ArchitectureDiagram:
      type: object
      properties:
        id: { type: string, example: "diag_c4_container" }
        title: { type: string, example: "Container Level C4 Diagram" }
        c4Level: { type: string, example: "container" }
        mermaidScript: { type: string, example: "graph TD; A[Angular]-->B[Spring Boot];" }
        excalidrawUrl: { type: string, example: "https://excalidraw.com/#json=123" }

    ArchitectureDiagramRequest:
      type: object
      required: [title, c4Level, mermaidScript]
      properties:
        title: { type: string, example: "Component Level C4 Diagram" }
        c4Level: { type: string, example: "component" }
        mermaidScript: { type: string, example: "graph TD; Auth-->UserRepo;" }

    Article:
      type: object
      properties:
        id: { type: string, example: "art_01" }
        title: { type: string, example: "Migrating Spring Boot 3 to GraalVM Native Image" }
        slug: { type: string, example: "migrating-spring-boot-graalvm" }
        contentMarkdown: { type: string, example: "# GraalVM Tutorial..." }
        publishedAt: { type: string, format: date-time }

    ArticleRequest:
      type: object
      required: [title, slug, contentMarkdown]
      properties:
        title: { type: string }
        slug: { type: string }
        contentMarkdown: { type: string }

    VideoMedia:
      type: object
      properties:
        id: { type: string, example: "vid_01" }
        title: { type: string, example: "GitOps CI/CD Live Walkthrough" }
        provider: { type: string, example: "Loom" }
        embedUrl: { type: string, example: "https://www.loom.com/embed/12345" }

    VideoMediaRequest:
      type: object
      required: [title, provider, embedUrl]
      properties:
        title: { type: string }
        provider: { type: string, example: "YouTube" }
        embedUrl: { type: string }

    IngressTrackingRequest:
      type: object
      required: [referrer, userAgent]
      properties:
        referrer: { type: string, example: "https://linkedin.com/in/recruiter" }
        userAgent: { type: string, example: "Mozilla/5.0..." }
        recruiterRefCode: { type: string, example: "META-2026" }

    RecruiterVisitLog:
      type: object
      properties:
        visitId: { type: string, example: "vst_12345" }
        organization: { type: string, example: "Meta Platforms Inc." }
        country: { type: string, example: "United States" }
        timestamp: { type: string, format: date-time }

    SystemHealthResponse:
      type: object
      properties:
        status: { type: string, example: "UP" }
        database: { type: string, example: "PostgreSQL 16 - Connected" }
        redisCache: { type: string, example: "Redis Cluster - Healthy" }
        circuitBreakers:
          type: object
          properties:
            aiEngine: { type: string, example: "CLOSED" }

    TelemetryStream:
      type: string
      description: Server-Sent Events body; each event's data is a TelemetryEvent in JSON.

    TelemetryEvent:
      type: object
      required: [timestamp, eventType, details, traceId]
      properties:
        timestamp: { type: string, format: date-time }
        eventType:
          type: string
          enum: [CACHE_HIT, CACHE_MISS, VECTOR_SEARCH, RAG_QUERY, JWT_VERIFIED, PRICING_REQUEST, PRICING_CACHED, PRICING_UNESTIMATED, PRICING_FALLBACK, MCP_TOOL_CALL]
        details: { type: string, example: "5 fragmentos · 12 ms" }
        traceId: { type: string, example: "3f1c9a52-8d4e-4b7a-9c61-2e5f0b7d4a18" }

    PricingRequest:
      type: object
      required: [cloudProvider, services]
      properties:
        cloudProvider: { type: string, enum: [aws, gcp, azure, oci], description: "`oci` (Oracle Cloud Infrastructure) is only accepted while the `cloud.oracle` feature flag is on." }
        services:
          description: Service codes of the catalog (the `type` of each node of the canvas).
          type: array
          minItems: 1
          maxItems: 60
          items: { type: string, pattern: '^[A-Za-z0-9_-]{1,48}$', example: "vm" }

    PricingResponse:
      type: object
      required: [cloudProvider, currency, quotes]
      properties:
        cloudProvider: { type: string, enum: [aws, gcp, azure, oci], description: "`oci` (Oracle Cloud Infrastructure) is only accepted while the `cloud.oracle` feature flag is on." }
        currency: { type: string, example: "USD" }
        quotes:
          type: array
          items:
            $ref: '#/components/schemas/PriceQuote'

    PriceQuote:
      type: object
      required: [code, status]
      properties:
        code: { type: string, example: "vm" }
        status:
          type: string
          description: >
            LIVE: just read from the provider. CACHED: read from the provider within the last 24 hours.
            STALE: the provider did not answer and this is the last known price. UNKNOWN_PRICING: no SKU mapped
            or no price available. UNESTIMATED_ENTERPRISE_LICENSE: licensed product without a public price API.
          enum: [LIVE, CACHED, STALE, UNKNOWN_PRICING, UNESTIMATED_ENTERPRISE_LICENSE]
        sku: { type: string, example: "D2s_v5" }
        description: { type: string, example: "Virtual Machines Dsv5 Series · D2s v5" }
        region: { type: string, example: "eastus" }
        unit: { type: string, enum: [HOURLY, MONTHLY, PER_GB] }
        unitPrice: { type: number, format: double, example: 0.096 }
        monthlyCost:
          description: Unit price over a 730 hour month, for one unit. Absent when the unit cannot be turned into a month.
          type: number
          format: double
          example: 70.08
        currency: { type: string, example: "USD" }
        source: { type: string, example: "Azure Retail Prices API" }
        fetchedAt: { type: string, format: date-time }
        note: { type: string, example: "Solo el cómputo; no incluye disco ni tráfico de salida." }

    AIQueryRequest:
      type: object
      required: [prompt]
      properties:
        prompt: { type: string, example: "How does the circuit breaker handle database timeouts?" }

    AIQueryResponse:
      type: object
      properties:
        answer: { type: string, example: "The backend leverages Resilience4j CircuitBreaker..." }
        citations:
          type: array
          items:
            type: object
            properties:
              filePath: { type: string, example: "backend/ResilienceConfig.java" }
              lineNumberRange: { type: string, example: "40-55" }
              codeSnippet: { type: string, example: "@Bean public CircuitBreaker..." }

  responses:
    BadRequestError:
      description: "Error de validación de sintaxis o reglas de negocio (HTTP 400)."
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ProblemDetails'

    UnauthorizedError:
      description: "Fallo de autenticación o token JWT ausente/inválido (HTTP 401)."
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ProblemDetails'

    ForbiddenError:
      description: "El usuario no cuenta con los roles/permisos necesarios (HTTP 403)."
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ProblemDetails'

    NotFoundError:
      description: "El recurso solicitado no fue encontrado (HTTP 404)."
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ProblemDetails'

    RateLimitError:
      description: "Límite de tasa de peticiones excedido (HTTP 429)."
      headers:
        X-RateLimit-Limit:
          schema: { type: integer }
        X-RateLimit-Remaining:
          schema: { type: integer }
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ProblemDetails'

    InternalServerError:
      description: "Error interno no controlado en el servidor (HTTP 500)."
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ProblemDetails'

    ServiceUnavailableError:
      description: "Servicio o componente dependiente no disponible (HTTP 503)."
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ProblemDetails'
