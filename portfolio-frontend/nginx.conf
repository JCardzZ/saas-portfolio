server {
    listen 8080;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    gzip on;
    gzip_types text/css application/javascript application/json image/svg+xml;
    gzip_min_length 1024;

    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header X-Frame-Options "DENY" always;

    # Aplicación de una sola página: cualquier ruta que no sea un archivo la resuelve Angular.
    location / {
        try_files $uri $uri/ /index.html;
    }

    # index.html no se cachea, para que un despliegue nuevo se vea de inmediato.
    location = /index.html {
        add_header Cache-Control "no-cache" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        add_header X-Frame-Options "DENY" always;
    }

    # Configuración en tiempo de ejecución: se cambia sin reconstruir la imagen (montando el archivo).
    location = /config.json {
        add_header Cache-Control "no-store" always;
        add_header X-Content-Type-Options "nosniff" always;
    }

    # Los archivos generados llevan un hash en el nombre: se pueden cachear para siempre.
    location ~* \.(?:js|css|woff2?|ico|svg|png|jpg|webp)$ {
        add_header Cache-Control "public, max-age=31536000, immutable" always;
        add_header X-Content-Type-Options "nosniff" always;
        try_files $uri =404;
    }
}
