<header class="border-b border-slate-200 bg-white">
  <div class="mx-auto flex max-w-6xl flex-wrap items-center justify-between gap-3 px-6 py-4">
    <div class="flex flex-wrap items-center gap-x-8 gap-y-2">
      <span class="text-lg font-semibold">Portfolio CMS</span>
      <nav class="flex flex-wrap gap-1" aria-label="Secciones del panel">
        @for (section of sections(); track section.path) {
          <a
            [routerLink]="section.path"
            routerLinkActive="bg-indigo-50 text-indigo-700"
            class="rounded-md px-3 py-2 text-sm font-medium text-slate-600 hover:bg-slate-100"
          >
            {{ section.label }}
          </a>
        }
      </nav>
    </div>
    <div class="flex items-center gap-3">
      @if (who(); as current) {
        <span class="text-right text-sm leading-tight" data-testid="session-who">
          <span class="block font-medium text-slate-900">{{ current.name }}</span>
          <span class="block text-xs text-slate-500">{{ current.role }}</span>
        </span>
      }
      <a routerLink="/" class="text-sm font-medium text-slate-600 hover:text-slate-900">Ver sitio público</a>
      <button type="button" class="btn-secondary" (click)="logout()">Cerrar sesión</button>
    </div>
  </div>
</header>

<main class="mx-auto max-w-6xl px-6 py-8">
  <router-outlet />
</main>
