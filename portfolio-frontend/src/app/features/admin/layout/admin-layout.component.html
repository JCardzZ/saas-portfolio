<header class="border-b border-slate-200 bg-white">
  <div class="mx-auto flex max-w-6xl items-center justify-between px-6 py-4">
    <div class="flex items-center gap-8">
      <span class="text-lg font-semibold">Portfolio CMS</span>
      <nav class="flex gap-1" aria-label="Secciones del panel">
        <a
          routerLink="technologies"
          routerLinkActive="bg-indigo-50 text-indigo-700"
          class="rounded-md px-3 py-2 text-sm font-medium text-slate-600 hover:bg-slate-100"
        >
          Tecnologías
        </a>
        <a
          routerLink="projects"
          routerLinkActive="bg-indigo-50 text-indigo-700"
          class="rounded-md px-3 py-2 text-sm font-medium text-slate-600 hover:bg-slate-100"
        >
          Proyectos
        </a>
        <a
          routerLink="articles"
          routerLinkActive="bg-indigo-50 text-indigo-700"
          class="rounded-md px-3 py-2 text-sm font-medium text-slate-600 hover:bg-slate-100"
        >
          Artículos
        </a>
        <a
          routerLink="assistant"
          routerLinkActive="bg-indigo-50 text-indigo-700"
          class="rounded-md px-3 py-2 text-sm font-medium text-slate-600 hover:bg-slate-100"
        >
          Asistente IA
        </a>
        <a
          routerLink="features"
          routerLinkActive="bg-indigo-50 text-indigo-700"
          class="rounded-md px-3 py-2 text-sm font-medium text-slate-600 hover:bg-slate-100"
        >
          Flags
        </a>
      </nav>
    </div>
    <div class="flex items-center gap-3">
      <a routerLink="/" class="text-sm font-medium text-slate-600 hover:text-slate-900">Ver sitio público</a>
      <button type="button" class="btn-secondary" (click)="logout()">Cerrar sesión</button>
    </div>
  </div>
</header>

<main class="mx-auto max-w-6xl px-6 py-8">
  <router-outlet />
</main>
