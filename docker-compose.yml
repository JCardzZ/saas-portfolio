# Entorno local completo: PostgreSQL 16 con pgvector, Redis y el backend.
#
#   ./scripts/dev-up.sh          crea .env con secretos propios (la primera vez) y lo levanta todo
#   docker compose up -d         lo mismo, si .env ya existe
#   docker compose up -d postgres redis   solo los datos, para ejecutar el backend con ./gradlew bootRun
#   docker compose down          lo para (los datos quedan en volúmenes; `down -v` los borra)
#
# Es para desarrollo: los puertos solo escuchan en 127.0.0.1 y la contraseña de PostgreSQL es
# la de por defecto. El despliegue real es deploy/docker-compose.yml, con datos externos.
name: saas-portfolio-local

services:
  postgres:
    # PostgreSQL 16 con la extensión vector ya instalada (la crea la migración V3).
    image: pgvector/pgvector:pg16
    restart: unless-stopped
    environment:
      POSTGRES_DB: portfolio_db
      POSTGRES_USER: ${DB_USERNAME:-postgres}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-postgres}
    ports:
      - "127.0.0.1:${POSTGRES_PORT:-5432}:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 3s
      retries: 20

  redis:
    # Caché del CMS, límites de peticiones y tarifas de las API de precios (24 h).
    image: redis:7-alpine
    restart: unless-stopped
    # Sin persistencia: todo lo que guarda se puede volver a calcular o a pedir.
    command: ["redis-server", "--save", "", "--appendonly", "no", "--maxmemory", "128mb", "--maxmemory-policy", "allkeys-lru"]
    ports:
      - "127.0.0.1:${REDIS_PORT:-6379}:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 20

  backend:
    build:
      context: .
      dockerfile: portfolio-backend/Dockerfile
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    environment:
      # No hay application-local.yml en el repositorio (nunca se sube): la configuración local
      # entra por estas variables. Los perfiles quedan activos por si creas el tuyo.
      SPRING_PROFILES_ACTIVE: ${SPRING_PROFILES_ACTIVE:-local,dev}
      DB_URL: jdbc:postgresql://postgres:5432/portfolio_db
      DB_USERNAME: ${DB_USERNAME:-postgres}
      DB_PASSWORD: ${DB_PASSWORD:-postgres}
      REDIS_HOST: redis
      REDIS_PORT: "6379"
      JWT_SECRET: ${JWT_SECRET:?Falta JWT_SECRET en .env (ejecuta ./scripts/dev-up.sh)}
      ADMIN_CLIENT_SECRET: ${ADMIN_CLIENT_SECRET:?Falta ADMIN_CLIENT_SECRET en .env (ejecuta ./scripts/dev-up.sh)}
      CORS_ALLOWED_ORIGINS: ${CORS_ALLOWED_ORIGINS:-http://localhost:4200}
      # Sin clave, la IA responde 503 y el resto funciona.
      GEMINI_API_KEY: ${GEMINI_API_KEY:-}
      # Precios de lista de Azure y AWS: fuentes públicas, sin clave. Con false no sale ninguna petición.
      PRICING_AZURE_ENABLED: ${PRICING_AZURE_ENABLED:-true}
      PRICING_AWS_ENABLED: ${PRICING_AWS_ENABLED:-true}
      # Google Cloud exige clave de API; sin ella no se le consulta nada.
      GCP_PRICING_API_KEY: ${GCP_PRICING_API_KEY:-}
    ports:
      - "127.0.0.1:${BACKEND_PORT:-8080}:8080"
    volumes:
      - backend-data:/app/data

volumes:
  postgres-data:
  backend-data:
